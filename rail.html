    body {

      padding: 0;

      background: #0d47a1;
      color: white;
    }
    h1 {
      margin: 0;
      font-size: 1.5em;
    }
    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .nav-btn {
      padding: 6px 10px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      font-size: 12px;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.3); }
    .nav-btn.active { background: rgba(255,255,255,0.4); font-weight: bold; }
    .nav-btn.home { background: #FF9800; border-color: #FF9800; }
    .nav-btn.home:hover { background: #F57C00; }
    #lang-btn {
      padding: 6px 12px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    #lang-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .station-distance {
      font-size: 0.75em;
      color: #666;
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: auto;
    }
    .container {
      display: flex;
      height: calc(100vh - 52px);
    }
    #panel {
      width: 380px;
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid #ccc;
      background: #f9f9f9;
    }
    #map-canvas {
      flex: 1;
      height: 100%;
    }
    .search-box {
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .search-box input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .search-box select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .station-list {
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .station-item {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .station-item:hover {
      background: #e3f2fd;
    }
    .station-item.selected {
      background: #bbdefb;
    }
    .station-name {
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .station-id {
      font-size: 0.75em;
      background: #0d47a1;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .station-info {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 4px;
    }
    .line-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.75em;
      color: white;
      font-weight: bold;
      margin-right: 4px;
    }
    .class-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.7em;
      background: #666;
      color: white;
    }
    .result-count {
      padding: 8px 15px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      font-size: 0.85em;
      color: #666;
    }
    /* Line colors */
    .line-WL { background-color: #1976d2; }
    .line-ML { background-color: #388e3c; }
    .line-CL { background-color: #f57c00; }
    .line-SL { background-color: #7b1fa2; }
    .line-YL { background-color: #00897b; }
    .line-NL { background-color: #c62828; }
    .line-TL { background-color: #5d4037; }
    .line-SLL { background-color: #ff6f00; }
    .line-PX { background-color: #9e9d24; }
    .line-NW { background-color: #6a1b9a; }
    .line-JJ { background-color: #2e7d32; }
    .line-SH { background-color: #00838f; }
    .line-LJ { background-color: #ad1457; }
    /* Station class colors */
    .class-1 { background-color: #c62828; }
    .class-2 { background-color: #1565c0; }
    .class-3 { background-color: #2e7d32; }
    .class-S { background-color: #6a1b9a; }

      border: 2px solid #fff;

      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      color: white;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      #panel { width: 100%; height: 40%; }
      #map-canvas { height: 60%; }

  { id: '8110', name: { en: 'Liujia', zh: '六家' }, line: 'LJ', class: '2', lat: 24.8039, lng: 121.0361, km: 4.5 },

  // ===== Jiji Line (JJ) - Branch line =====
  { id: '8200', name: { en: 'Yuanquan', zh: '源泉' }, line: 'JJ', class: 'S', lat: 23.8028, lng: 120.6422, km: 3.0 },
  { id: '8210', name: { en: 'Zhuoshui', zh: '濁水' }, line: 'JJ', class: 'S', lat: 23.8231, lng: 120.6769, km: 7.0 },
  { id: '8220', name: { en: 'Longquan', zh: '龍泉' }, line: 'JJ', class: 'S', lat: 23.8258, lng: 120.7033, km: 10.0 },
  { id: '8230', name: { en: 'Jiji', zh: '集集' }, line: 'JJ', class: '3', lat: 23.8269, lng: 120.7486, km: 14.5 },
  { id: '8240', name: { en: 'Shuili', zh: '水里' }, line: 'JJ', class: '3', lat: 23.8139, lng: 120.8567, km: 24.5 },
  { id: '8250', name: { en: 'Checheng', zh: '車埕' }, line: 'JJ', class: 'S', lat: 23.8333, lng: 120.8661, km: 29.5 },

  // ===== Shalun Line (SH) - Branch line =====
  { id: '8300', name: { en: 'Changrong University', zh: '長榮大學' }, line: 'SH', class: 'S', lat: 22.9289, lng: 120.2658, km: 2.5 },
  { id: '8310', name: { en: 'Shalun', zh: '沙崙' }, line: 'SH', class: '2', lat: 22.9250, lng: 120.2858, km: 5.0 }
];

const CONFIG = {
  DEFAULT_CENTER: [23.9, 121.0],
  DEFAULT_ZOOM: 8
};

// State
let map = null;
let markers = {};
let filteredStations = [...STATIONS];
let currentLine = 'all';
let currentClass = 'all';
let selectedStation = null;
let isZh = (navigator.language || navigator.userLanguage).startsWith('zh');
let userLocation = null;

// Distance calculation utilities
const deg2rad = (deg) => deg * (Math.PI / 180);

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = deg2rad(lat2 - lat1);
  const dLon = deg2rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
    Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function formatDistance(meters) {
  if (meters < 1000) return `${Math.round(meters)} m`;
  return `${(meters / 1000).toFixed(1)} km`;
}

function isChineseLocale() {
  return isZh;
}

function toggleLang() {
  isZh = !isZh;
  localStorage.setItem('ubike-lang', isZh ? 'zh' : 'en');
  updateUI();
}

function updateUI() {
  // Update page title
  document.getElementById('page-title').textContent = isZh ? '台灣鐵路 (台鐵)' : 'Taiwan Rail (TRA)';

  // Update search placeholder
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.placeholder = isZh ? '搜尋車站...' : 'Search stations...';
  }

  // Update navigation buttons
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const text = isZh ? btn.dataset.zh : btn.dataset.en;
    if (text) btn.textContent = text;
  });

  // Update line and class selects
  initLineSelect();
  initClassSelect();

  // Restore current selections
  document.getElementById('line-select').value = currentLine;
  document.getElementById('class-select').value = currentClass;

  // Re-render station list and update popups
  updateDisplay();

  // Update all marker popups
  Object.keys(markers).forEach(id => {
    const station = STATIONS.find(s => s.id === id);
    if (station && markers[id]) {
      markers[id].setPopupContent(getPopupContent(station));
    }
  });
}

function getLineInfo(lineCode) {
  return RAIL_LINES[lineCode] || { name: { en: lineCode, zh: lineCode }, color: '#666' };
}

function getClassInfo(classCode) {
  return STATION_CLASSES[classCode] || { name: { en: classCode, zh: classCode }, color: '#666' };
}

function getStationName(station) {
  return isChineseLocale() ? station.name.zh : station.name.en;
}

function getLineName(lineCode) {
  const lineInfo = getLineInfo(lineCode);
  return isChineseLocale() ? lineInfo.name.zh : lineInfo.name.en;
}

function getClassName(classCode) {
  const classInfo = getClassInfo(classCode);
  return isChineseLocale() ? classInfo.name.zh : classInfo.name.en;
}

function createMarkerIcon(lineCode, classCode) {
  const lineInfo = getLineInfo(lineCode);
  const size = classCode === '1' ? 16 : classCode === '2' ? 14 : 12;
  return L.divIcon({
    className: '',
    html: `<div class="marker-icon" style="width:${size}px;height:${size}px;background-color:${lineInfo.color};"></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -size/2]
  });
}

function getPopupContent(station) {
  const isZh = isChineseLocale();
  const lineName = getLineName(station.line);
  const className = getClassName(station.class);

  let distanceHtml = '';
  if (userLocation && station.lat && station.lng) {
    const distance = getDistanceInMeters(userLocation.lat, userLocation.lng, station.lat, station.lng);
    distanceHtml = `<br>${isZh ? '距離' : 'Distance'}: ${formatDistance(distance)}`;
  }

  const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}`;
  const appleMapsUrl = `http://maps.apple.com/?daddr=${station.lat},${station.lng}`;
  const btnStyle = 'display:inline-block;padding:4px 8px;margin:2px;background:#0d47a1;color:white;text-decoration:none;border-radius:4px;font-size:11px;';

  return `<div>
    <strong>${getStationName(station)}</strong><br>
    <small>${station.id}</small><br>
    ${isZh ? '路線' : 'Line'}: ${lineName}<br>
    ${isZh ? '等級' : 'Class'}: ${className}<br>
    ${station.km ? (isZh ? '里程' : 'KM') + ': ' + station.km + ' km' : ''}${distanceHtml}
    <div style="margin-top:8px;">
      <a href="${googleMapsUrl}" target="_blank" style="${btnStyle}">${isZh ? 'Google導航' : 'Google Maps'}</a>
      <a href="${appleMapsUrl}" target="_blank" style="${btnStyle}">${isZh ? 'Apple導航' : 'Apple Maps'}</a>
    </div>
  </div>`;
}

function createStationListItem(station) {
  const lineInfo = getLineInfo(station.line);
  const classInfo = getClassInfo(station.class);
  const lineName = getLineName(station.line);
  const className = getClassName(station.class);
  let distanceHtml = '';
  if (userLocation && station.lat && station.lng) {
    const distance = getDistanceInMeters(userLocation.lat, userLocation.lng, station.lat, station.lng);
    distanceHtml = `<span class="station-distance">${formatDistance(distance)}</span>`;
  }

  return `
    <li class="station-item" data-id="${station.id}">
      <div class="station-name">
        <span class="station-id">${station.id}</span>
        ${getStationName(station)}
        ${distanceHtml}
      </div>
      <div class="station-info">
        <span class="line-badge line-${station.line}">${lineName}</span>
        <span class="class-badge class-${station.class}">${className}</span>
        ${station.km ? `<span style="margin-left:8px;color:#999;">${station.km} km</span>` : ''}
      </div>
    </li>
  `;
}

function addMarkers(stationList) {
  Object.values(markers).forEach(marker => map.removeLayer(marker));
  markers = {};

  stationList.forEach(station => {
    if (!station.lat || !station.lng) return;
    const marker = L.marker([station.lat, station.lng], {
      icon: createMarkerIcon(station.line, station.class)
    });

    marker.bindPopup(getPopupContent(station));
    marker.on('click', () => selectStation(station.id));
    marker.addTo(map);
    markers[station.id] = marker;
  });

  console.log(`[Rail] Added ${Object.keys(markers).length} markers`);
}

function renderStationList(stationList) {
  const listEl = document.getElementById('station-list');
  const countEl = document.getElementById('result-count');
  const isZh = isChineseLocale();

  listEl.innerHTML = stationList.map(createStationListItem).join('');
  countEl.textContent = isZh
    ? `顯示 ${stationList.length} 個車站`
    : `Showing ${stationList.length} stations`;

  listEl.querySelectorAll('.station-item').forEach(item => {
    item.addEventListener('click', () => {
      selectStation(item.dataset.id);
    });
  });
}

function selectStation(id) {
  document.querySelectorAll('.station-item.selected').forEach(el => {
    el.classList.remove('selected');
  });

  const listItem = document.querySelector(`.station-item[data-id="${id}"]`);
  if (listItem) {
    listItem.classList.add('selected');
    listItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const marker = markers[id];
  if (marker) {
    map.setView(marker.getLatLng(), 14);
    marker.openPopup();
  }

  selectedStation = id;
  console.log(`[Rail] Selected station: ${id}`);
}

function filterStations() {
  let filtered = [...STATIONS];

  // Filter by line
  if (currentLine !== 'all') {
    filtered = filtered.filter(s => s.line === currentLine);
  }

  // Filter by class
  if (currentClass !== 'all') {
    filtered = filtered.filter(s => s.class === currentClass);
  }

  // Filter by search query
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  if (query) {
    filtered = filtered.filter(station => {
      const nameZh = station.name.zh.toLowerCase();
      const nameEn = station.name.en.toLowerCase();
      const id = station.id.toLowerCase();
      return nameZh.includes(query) || nameEn.includes(query) || id.includes(query);
    });
  }

  return filtered;
}

function updateDisplay() {
  const filtered = filterStations();
  filteredStations = filtered;
  renderStationList(filtered);
  addMarkers(filtered);
}

function changeLine() {
  const select = document.getElementById('line-select');
  currentLine = select.value;
  localStorage.setItem('rail-line', currentLine);
  console.log(`[Rail] Line changed to: ${currentLine}`);
  updateDisplay();
}

function changeClass() {
  const select = document.getElementById('class-select');
  currentClass = select.value;
  console.log(`[Rail] Class changed to: ${currentClass}`);
  updateDisplay();
}

function handleSearch(e) {
  updateDisplay();
  console.log(`[Rail] Search: "${e.target.value}" - ${filteredStations.length} results`);
}

function initLineSelect() {
  const lineSelect = document.getElementById('line-select');
  const isZh = isChineseLocale();

  let options = '<option value="all">' + (isZh ? '所有路線' : 'All Lines') + '</option>';
  Object.entries(RAIL_LINES).forEach(([code, info]) => {
    const lineName = isZh ? info.name.zh : info.name.en;
    options += `<option value="${code}">${lineName}</option>`;
  });

  lineSelect.innerHTML = options;
}

function initClassSelect() {
  const classSelect = document.getElementById('class-select');
  const isZh = isChineseLocale();

  let options = '<option value="all">' + (isZh ? '所有等級' : 'All Classes') + '</option>';
  Object.entries(STATION_CLASSES).forEach(([code, info]) => {
    const className = isZh ? info.name.zh : info.name.en;
    options += `<option value="${code}">${className}</option>`;
  });

  classSelect.innerHTML = options;
}

async function initialize() {
  console.log('[Rail] Initializing Taiwan Rail map...');

  // Restore language preference
  const savedLang = localStorage.getItem('ubike-lang');
  if (savedLang) {
    isZh = savedLang === 'zh';
  }

  // Restore line preference
  const savedLine = localStorage.getItem('rail-line');
  if (savedLine && (RAIL_LINES[savedLine] || savedLine === 'all')) {
    currentLine = savedLine;
  }

  // Get user location
  if ('geolocation' in navigator) {
    try {
      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
      });
      userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
      console.log('[Rail] User location:', userLocation);
    } catch (error) {
      console.warn('[Rail] Could not get location:', error.message);
    }
  }

  // Create map
  map = L.map('map-canvas').setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  // Setup UI with language
  initLineSelect();
  initClassSelect();

  if (currentLine !== 'all') {
    document.getElementById('line-select').value = currentLine;
  }

  // Update page title based on language
  document.getElementById('page-title').textContent = isZh ? '台灣鐵路 (台鐵)' : 'Taiwan Rail (TRA)';

  // Update navigation buttons
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const text = isZh ? btn.dataset.zh : btn.dataset.en;
    if (text) btn.textContent = text;
  });

  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', handleSearch);
  searchInput.placeholder = isZh ? '搜尋車站...' : 'Search stations...';

  // Initial load
  updateDisplay();

  console.log('[Rail] Taiwan Rail map initialized successfully');
}

document.addEventListener('DOMContentLoaded', initialize);
  </script>
