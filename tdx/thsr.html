<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1976d2">
    <link rel="icon" type="image/png" href="../favicon.ico">
    <title>Taiwan High Speed Rail Stations</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
      }
      header {
        background: linear-gradient(135deg, #1976d2, #0d47a1);
        color: white;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 { margin: 0; font-size: 1.5em; }
      .header-controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .nav-btn {
        padding: 6px 10px;
        background: rgba(255,255,255,0.2);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        color: white;
        font-size: 12px;
      }
      .nav-btn:hover { background: rgba(255,255,255,0.3); }
      .nav-btn.active { background: rgba(255,255,255,0.4); font-weight: bold; }
      .nav-btn.home { background: #FF9800; border-color: #FF9800; }
      .nav-btn.home:hover { background: #F57C00; }
      @media (max-width: 768px) {
        header {
          padding: 8px 10px;
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
        h1 {
          font-size: 1.2em;
          width: 100%;
        }
        .header-controls {
          width: 100%;
          flex-wrap: wrap;
          gap: 4px;
          justify-content: flex-start;
        }
        .nav-btn {
          padding: 4px 8px;
          font-size: 11px;
        }
      }
      /* Floating buttons */
      .float-btn-container {
        position: fixed;
        bottom: 20px;
        right: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
      }
      .float-btn {
        width: 44px;
        height: 44px;
        background: white;
        border: 2px solid rgba(0,0,0,0.2);
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        transition: background 0.2s;
      }
      .float-btn:hover { background: #f4f4f4; }
      .float-btn:active { background: #e0e0e0; }
      .container {
        display: flex;
        height: calc(100vh - 52px);
        position: relative;
      }
      #panel {
        width: 380px;
        height: 100%;
        overflow-y: auto;
        border-right: 1px solid #ccc;
        background: #f9f9f9;
      }
      #map-canvas {
        flex: 1;
        height: 100%;
      }
      .info-box {
        padding: 12px 15px;
        background: #fff3e0;
        border-bottom: 1px solid #ffcc80;
        font-size: 0.85em;
        color: #e65100;
      }
      .station-list {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .station-item {
        padding: 14px 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .station-item:hover {
        background: #fff3e0;
      }
      .station-item.selected {
        background: #ffe0b2;
      }
      .station-number {
        width: 32px;
        height: 32px;
        background: #f57c00;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.9em;
        flex-shrink: 0;
      }
      .station-info { flex: 1; }
      .station-name {
        font-weight: bold;
        margin-bottom: 2px;
      }
      .station-details {
        font-size: 0.85em;
        color: #666;
      }
      .station-km {
        font-size: 0.8em;
        color: #f57c00;
        font-weight: 500;
      }
      .marker-icon {
        background: #f57c00;
        color: white;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 11px;
      }
      .header-nav {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav-btn {
        padding: 6px 10px;
        background: rgba(255,255,255,0.2);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        color: white;
        font-size: 12px;
      }
      .nav-btn:hover { background: rgba(255,255,255,0.3); }
      .nav-btn.home { background: #FF9800; border-color: #FF9800; }
      .nav-btn.home:hover { background: #F57C00; }

      /* Sheet handle - hidden on desktop */
      .sheet-handle { display: none; }
      .sheet-content { display: contents; }

      @media (max-width: 768px) {
        /* Map full screen on mobile */
        #map-canvas {
          position: fixed !important;
          top: 74px;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 1;
          height: auto !important;
        }

        /* Panel becomes bottom sheet */
        #panel {
          position: fixed !important;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100% !important;
          height: auto !important;
          max-height: 90vh;
          background: white;
          border-radius: 16px 16px 0 0;
          border-right: none !important;
          box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
          z-index: 1000;
          transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          will-change: transform;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        #panel.snap-collapsed { transform: translateY(calc(100% - 56px)); }
        #panel.snap-half { transform: translateY(40vh); }
        #panel.snap-full { transform: translateY(0); }
        #panel.dragging { transition: none; }
        #panel.no-transition { transition: none; }

        .sheet-handle {
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 56px;
          padding: 8px 16px;
          cursor: grab;
          touch-action: none;
          user-select: none;
          background: white;
          border-radius: 16px 16px 0 0;
          flex-shrink: 0;
        }

        .sheet-pill {
          width: 40px;
          height: 4px;
          background: #ccc;
          border-radius: 2px;
          margin-bottom: 8px;
        }

        .sheet-summary {
          font-size: 14px;
          color: #333;
          font-weight: 500;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          width: 100%;
          text-align: center;
        }

        .sheet-content {
          display: flex;
          flex-direction: column;
          flex: 1;
          overflow-y: auto;
          overscroll-behavior: contain;
          min-height: 0;
        }

        .float-btn-container {
          bottom: 70px !important;
          z-index: 1001 !important;
        }

        .container { flex-direction: column; }
        header { flex-wrap: wrap; gap: 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="page-title">THSR Stations</h1>
      <div class="header-controls">
        <a href="../index.html" class="nav-btn home" data-en="Home" data-zh="首頁">Home</a>
        <a href="../ubike.html" class="nav-btn" data-en="UBike" data-zh="微笑單車">UBike</a>
        <a href="../mrt.html" class="nav-btn" data-en="MRT" data-zh="捷運">MRT</a>
        <a href="../rail.html" class="nav-btn" data-en="Rail" data-zh="台鐵">Rail</a>
        <a href="../thsr.html" class="nav-btn active" data-en="THSR" data-zh="高鐵">THSR</a>
        <a href="../bus.html" class="nav-btn" data-en="Bus" data-zh="公車">Bus</a>
        <a href="../earthquake.html" class="nav-btn" data-en="Quake" data-zh="地震">Quake</a>
      </div>
    </header>
    <div class="container">
      <div id="panel">
        <div class="sheet-handle">
          <div class="sheet-pill"></div>
          <div class="sheet-summary" id="sheet-summary">Loading...</div>
        </div>
        <div class="sheet-content">
        <div class="info-box" id="info-box">
          12 stations • Nangang to Zuoying • 350 km in ~90 min
        </div>
        <ul id="station-list" class="station-list"></ul>
        </div><!-- end .sheet-content -->
      </div>
      <div id="map-canvas"></div>
      <div class="float-btn-container">
        <button class="float-btn" id="lang-btn" onclick="toggleLang()">EN</button>
      </div>
    </div>

    <script src="../js/bottom-sheet.js"></script>
    <script>
    'use strict';

    // Taiwan High Speed Rail Stations (Static Data)
    const STATIONS = [
      { id: 'THSR-01', code: '0990', name: { en: 'Nangang', zh: '南港' }, lat: 25.0530, lng: 121.6070, km: 0, address: { en: 'Nangang District, Taipei', zh: '台北市南港區' } },
      { id: 'THSR-02', code: '1000', name: { en: 'Taipei', zh: '台北' }, lat: 25.0478, lng: 121.5170, km: 6.4, address: { en: 'Zhongzheng District, Taipei', zh: '台北市中正區' } },
      { id: 'THSR-03', code: '1010', name: { en: 'Banqiao', zh: '板橋' }, lat: 25.0145, lng: 121.4636, km: 12.7, address: { en: 'Banqiao District, New Taipei', zh: '新北市板橋區' } },
      { id: 'THSR-04', code: '1020', name: { en: 'Taoyuan', zh: '桃園' }, lat: 25.0127, lng: 121.2145, km: 42.1, address: { en: 'Zhongli District, Taoyuan', zh: '桃園市中壢區' } },
      { id: 'THSR-05', code: '1030', name: { en: 'Hsinchu', zh: '新竹' }, lat: 24.8086, lng: 121.0404, km: 78.2, address: { en: 'Zhubei City, Hsinchu County', zh: '新竹縣竹北市' } },
      { id: 'THSR-06', code: '1035', name: { en: 'Miaoli', zh: '苗栗' }, lat: 24.6053, lng: 120.8254, km: 110.9, address: { en: 'Houlong Township, Miaoli', zh: '苗栗縣後龍鎮' } },
      { id: 'THSR-07', code: '1040', name: { en: 'Taichung', zh: '台中' }, lat: 24.1127, lng: 120.6153, km: 165.7, address: { en: 'Wuri District, Taichung', zh: '台中市烏日區' } },
      { id: 'THSR-08', code: '1043', name: { en: 'Changhua', zh: '彰化' }, lat: 24.0520, lng: 120.5407, km: 177.5, address: { en: 'Tianzhong Township, Changhua', zh: '彰化縣田中鎮' } },
      { id: 'THSR-09', code: '1047', name: { en: 'Yunlin', zh: '雲林' }, lat: 23.7361, lng: 120.4165, km: 213.9, address: { en: 'Huwei Township, Yunlin', zh: '雲林縣虎尾鎮' } },
      { id: 'THSR-10', code: '1050', name: { en: 'Chiayi', zh: '嘉義' }, lat: 23.4593, lng: 120.3232, km: 251.2, address: { en: 'Taibao City, Chiayi County', zh: '嘉義縣太保市' } },
      { id: 'THSR-11', code: '1060', name: { en: 'Tainan', zh: '台南' }, lat: 22.9251, lng: 120.2861, km: 312.4, address: { en: 'Guiren District, Tainan', zh: '台南市歸仁區' } },
      { id: 'THSR-12', code: '1070', name: { en: 'Zuoying', zh: '左營' }, lat: 22.6875, lng: 120.3080, km: 345.2, address: { en: 'Zuoying District, Kaohsiung', zh: '高雄市左營區' } }
    ];

    let map = null;
    let markers = {};
    let selectedStation = null;
    let isZh = (navigator.language || navigator.userLanguage).startsWith('zh');
    let bottomSheet = null;

    function updateSheetSummary() {
      const summaryEl = document.getElementById('sheet-summary');
      if (!summaryEl) return;

      summaryEl.textContent = `🚄 ${STATIONS.length} ${isZh ? '站' : 'stations'}`;
    }

    function toggleLang() {
      isZh = !isZh;
      localStorage.setItem('ubike-lang', isZh ? 'zh' : 'en');
      updateUI();
    }

    function updateUI() {
      document.title = isZh ? '台灣高鐵' : 'Taiwan High Speed Rail';
      document.getElementById('page-title').textContent = isZh ? '🚄 台灣高鐵' : '🚄 Taiwan High Speed Rail';
      document.getElementById('info-box').textContent = isZh
        ? '12站 • 南港至左營 • 350公里約90分鐘'
        : '12 stations • Nangang to Zuoying • 350 km in ~90 min';

      // Update nav buttons
      document.querySelectorAll('.nav-btn[data-en][data-zh]').forEach(btn => {
        btn.textContent = isZh ? btn.dataset.zh : btn.dataset.en;
      });

      // Update language button
      const langBtn = document.getElementById('lang-btn');
      if (langBtn) {
        langBtn.textContent = isZh ? '中' : 'EN';
      }

      renderStationList();
      updatePopups();
    }

    function getStationName(station) {
      return isZh ? station.name.zh : station.name.en;
    }

    function getAddress(station) {
      return isZh ? station.address.zh : station.address.en;
    }

    function renderStationList() {
      const listEl = document.getElementById('station-list');
      listEl.innerHTML = STATIONS.map((station, index) => `
        <li class="station-item${selectedStation === station.id ? ' selected' : ''}" data-id="${station.id}">
          <div class="station-number">${index + 1}</div>
          <div class="station-info">
            <div class="station-name">${getStationName(station)}</div>
            <div class="station-details">${getAddress(station)}</div>
          </div>
          <div class="station-km">${station.km} km</div>
        </li>
      `).join('');

      listEl.querySelectorAll('.station-item').forEach(item => {
        item.addEventListener('click', () => selectStation(item.dataset.id));
      });
    }

    function selectStation(id) {
      selectedStation = id;
      const station = STATIONS.find(s => s.id === id);
      if (station && markers[id]) {
        map.setView([station.lat, station.lng], 15);
        markers[id].openPopup();
      }
      renderStationList();
    }

    function getPopupContent(station, index) {
      return `<div style="text-align:center;">
        <strong>${getStationName(station)}</strong><br>
        <small>${getAddress(station)}</small><br>
        ${isZh ? '里程' : 'Distance'}: ${station.km} km
      </div>`;
    }

    function updatePopups() {
      STATIONS.forEach((station, index) => {
        if (markers[station.id]) {
          markers[station.id].setPopupContent(getPopupContent(station, index));
        }
      });
    }

    function createMarkerIcon(index) {
      return L.divIcon({
        className: '',
        html: `<div class="marker-icon" style="width:28px;height:28px;">${index + 1}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    function initMap() {
      // Center on Taiwan
      map = L.map('map-canvas').setView([24.0, 120.8], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(map);

      // Add markers
      STATIONS.forEach((station, index) => {
        const marker = L.marker([station.lat, station.lng], {
          icon: createMarkerIcon(index)
        });
        marker.bindPopup(getPopupContent(station, index));
        marker.on('click', () => {
          selectedStation = station.id;
          renderStationList();
          document.querySelector(`.station-item[data-id="${station.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        marker.addTo(map);
        markers[station.id] = marker;
      });

      // Draw line connecting stations
      const lineCoords = STATIONS.map(s => [s.lat, s.lng]);
      L.polyline(lineCoords, { color: '#f57c00', weight: 4, opacity: 0.7 }).addTo(map);
    }

    function init() {
      const savedLang = localStorage.getItem('ubike-lang');
      if (savedLang) {
        isZh = savedLang === 'zh';
      }
      initMap();
      updateUI();

      // Initialize bottom sheet (mobile only)
      const panel = document.getElementById('panel');
      if (panel && typeof BottomSheet !== 'undefined') {
        bottomSheet = new BottomSheet(panel, {
          initialSnap: 'collapsed',
          onSnapChange: (snap) => {
            console.log('[THSR] Sheet snap:', snap);
          }
        });
      }

      updateSheetSummary();
      console.log('[THSR] Initialized with', STATIONS.length, 'stations');
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
