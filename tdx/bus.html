<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1976d2">
    <link rel="icon" type="image/png" href="../favicon.ico">
    <title>Taiwan Intercity Bus Terminals</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
      }
      header {
        background: linear-gradient(135deg, #1976d2, #0d47a1);
        color: white;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 { margin: 0; font-size: 1.5em; }
      /* Floating buttons */
      .float-btn-container {
        position: fixed;
        bottom: 20px;
        right: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
      }
      .float-btn {
        width: 44px;
        height: 44px;
        background: white;
        border: 2px solid rgba(0,0,0,0.2);
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        transition: background 0.2s;
      }
      .float-btn:hover { background: #f4f4f4; }
      .float-btn:active { background: #e0e0e0; }
      .container {
        display: flex;
        height: calc(100vh - 52px);
        position: relative;
      }
      #panel {
        width: 380px;
        height: 100%;
        overflow-y: auto;
        border-right: 1px solid #ccc;
        background: #f9f9f9;
      }
      #map-canvas {
        flex: 1;
        height: 100%;
      }
      /* Filter controls in panel */
      .filter-controls {
        padding: 10px;
        background: #f5f5f5;
        border-bottom: 1px solid #eee;
        display: flex;
        gap: 8px;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      #region-filter {
        flex: 1;
        padding: 8px 10px;
        border-radius: 4px;
        border: 1px solid #ddd;
        background: white;
        color: #333;
        font-size: 13px;
        cursor: pointer;
      }
      #region-filter:focus {
        outline: none;
        border-color: #7b1fa2;
      }
      #search-input {
        flex: 2;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 13px;
      }
      #search-input:focus {
        outline: none;
        border-color: #7b1fa2;
      }
      .info-box {
        padding: 10px 15px;
        background: #f3e5f5;
        border-bottom: 1px solid #ce93d8;
        font-size: 0.85em;
        color: #6a1b9a;
      }
      .station-list {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .station-item {
        padding: 14px 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        transition: background 0.2s;
      }
      .station-item:hover {
        background: #f3e5f5;
      }
      .station-item.selected {
        background: #e1bee7;
      }
      .station-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .station-type-badge {
        background: #7b1fa2;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.75em;
        font-weight: 500;
      }
      .station-type-badge.regional { background: #9c27b0; }
      .station-type-badge.local { background: #ab47bc; }
      .station-name {
        font-weight: bold;
        flex: 1;
      }
      .station-details {
        font-size: 0.85em;
        color: #666;
        margin-bottom: 4px;
      }
      .station-operators {
        font-size: 0.75em;
        color: #7b1fa2;
      }
      .marker-icon {
        background: #7b1fa2;
        color: white;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }
      .header-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav-btn {
        padding: 6px 10px;
        background: rgba(255,255,255,0.2);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        color: white;
        font-size: 12px;
      }
      .nav-btn:hover { background: rgba(255,255,255,0.3); }
      .nav-btn.home { background: #FF9800; border-color: #FF9800; }
      .nav-btn.home:hover { background: #F57C00; }

      /* Sheet handle - hidden on desktop */
      .sheet-handle { display: none; }
      .sheet-content { display: contents; }

      @media (max-width: 768px) {
        header {
          padding: 8px 10px;
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
        h1 {
          font-size: 1.2em;
          width: 100%;
        }
        .header-controls {
          width: 100%;
          flex-wrap: wrap;
          gap: 4px;
          justify-content: flex-start;
        }
        .nav-btn {
          padding: 4px 8px;
          font-size: 11px;
        }

        /* Map full screen on mobile */
        #map-canvas {
          position: fixed !important;
          top: 74px;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 1;
          height: auto !important;
        }

        /* Panel becomes bottom sheet */
        #panel {
          position: fixed !important;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100% !important;
          height: auto !important;
          max-height: 90vh;
          background: white;
          border-radius: 16px 16px 0 0;
          border-right: none !important;
          box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
          z-index: 1000;
          transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          will-change: transform;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        #panel.snap-collapsed { transform: translateY(calc(100% - 56px)); }
        #panel.snap-half { transform: translateY(40vh); }
        #panel.snap-full { transform: translateY(0); }
        #panel.dragging { transition: none; }
        #panel.no-transition { transition: none; }

        .sheet-handle {
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 56px;
          padding: 8px 16px;
          cursor: grab;
          touch-action: none;
          user-select: none;
          background: white;
          border-radius: 16px 16px 0 0;
          flex-shrink: 0;
        }

        .sheet-pill {
          width: 40px;
          height: 4px;
          background: #ccc;
          border-radius: 2px;
          margin-bottom: 8px;
        }

        .sheet-summary {
          font-size: 14px;
          color: #333;
          font-weight: 500;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          width: 100%;
          text-align: center;
        }

        .sheet-content {
          display: flex;
          flex-direction: column;
          flex: 1;
          overflow-y: auto;
          overscroll-behavior: contain;
          min-height: 0;
        }

        .float-btn-container {
          bottom: 70px !important;
          z-index: 1001 !important;
        }

        .container { flex-direction: column; }
      }
    </style>
  </head>

        <ul id="station-list" class="station-list"></ul>
        </div><!-- end .sheet-content -->
      </div>
      <div id="map-canvas"></div>
      <div class="float-btn-container">
        <button class="float-btn" id="lang-btn" onclick="toggleLang()">EN</button>

    </div>

    // Operator name translations
    const OPERATORS = {
      'Kuo-Kuang': '國光客運',
      'UBus': '統聯客運',
      'Kamalan': '葛瑪蘭客運',
      'Capital Bus': '首都客運',
      'Various operators': '多家業者',
      'Various': '多家業者',
      'Taoyuan Bus': '桃園客運',
      'Zhongli Bus': '中壢客運',
      'Hsinchu Bus': '新竹客運',
      'Taichung Bus': '台中客運',
      'Changhua Bus': '彰化客運',
      'Yuanlin Bus': '員林客運',
      'Nantou Bus': '南投客運',
      'Chiayi Bus': '嘉義客運',
      'BRT': '嘉義BRT',
      'Tainan Bus': '興南客運',
      'H31 Shuttle': 'H31接駁車',
      'Kaohsiung Bus': '高雄客運',
      'Pingtung Bus': '屏東客運',
      'Hualien Bus': '花蓮客運',
      'Tairoko Bus': '太魯閣客運',
      'Taitung Bus': '鼎東客運(山線)',
      'Dingdong Bus': '鼎東客運(海線)'
    };

    function getOperators(terminal) {
      if (isZh) {
        return terminal.operators.map(op => OPERATORS[op] || op).join('、');
      }
      return terminal.operators.join(', ');
    }

    let map = null;
    let markers = {};
    let selectedTerminal = null;
    let currentRegion = 'all';
    let searchQuery = '';
    let isZh = (navigator.language || navigator.userLanguage).startsWith('zh');
    let bottomSheet = null;

    function updateSheetSummary() {
      const summaryEl = document.getElementById('sheet-summary');
      if (!summaryEl) return;

      const filtered = getFilteredTerminals();
      const regionName = currentRegion === 'all'
        ? (isZh ? '全部' : 'All')
        : getRegionName(currentRegion);

      summaryEl.textContent = `🚌 ${regionName} · ${filtered.length} ${isZh ? '轉運站' : 'terminals'}`;
    }

    function toggleLang() {
      isZh = !isZh;
      localStorage.setItem('ubike-lang', isZh ? 'zh' : 'en');
      updateUI();
    }

    function getFilteredTerminals() {
      let filtered = TERMINALS;
      if (currentRegion !== 'all') {
        filtered = filtered.filter(t => t.region === currentRegion);
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(t =>
          t.name.en.toLowerCase().includes(q) ||
          t.name.zh.includes(q) ||
          t.city.en.toLowerCase().includes(q) ||
          t.city.zh.includes(q)
        );
      }
      return filtered;
    }

    function filterTerminals() {
      currentRegion = document.getElementById('region-filter').value;
      renderList();
      updateMarkers();
      updateSheetSummary();
    }

    function handleSearch(e) {
      searchQuery = e.target.value.trim();
      renderList();
      updateMarkers();
      updateSheetSummary();
    }

    function updateUI() {
      document.title = isZh ? '客運轉運站' : 'Intercity Bus Terminals';
      document.getElementById('page-title').textContent = isZh ? '🚌 客運轉運站' : '🚌 Intercity Bus Terminals';
      document.getElementById('info-box').textContent = isZh
        ? '台灣主要國道客運轉運站'
        : 'Major intercity bus terminals across Taiwan';
      document.getElementById('search-input').placeholder = isZh ? '搜尋轉運站...' : 'Search terminals...';
      document.getElementById('opt-all').textContent = isZh ? '全部地區' : 'All Regions';
      document.getElementById('opt-north').textContent = isZh ? '北部' : 'Northern';
      document.getElementById('opt-central').textContent = isZh ? '中部' : 'Central';
      document.getElementById('opt-south').textContent = isZh ? '南部' : 'Southern';
      document.getElementById('opt-east').textContent = isZh ? '東部' : 'Eastern';

      // Update nav buttons
      document.querySelectorAll('.nav-btn[data-en][data-zh]').forEach(btn => {
        btn.textContent = isZh ? btn.dataset.zh : btn.dataset.en;
      });

      // Update language button
      const langBtn = document.getElementById('lang-btn');
      if (langBtn) {
        langBtn.textContent = isZh ? '中' : 'EN';
      }

      renderList();
      updatePopups();
    }

    function getName(terminal) {
      return isZh ? terminal.name.zh : terminal.name.en;
    }

    function getCity(terminal) {
      return isZh ? terminal.city.zh : terminal.city.en;
    }

    function getAddress(terminal) {
      return isZh ? terminal.address.zh : terminal.address.en;
    }

    function getRegionName(region) {
      const names = {
        north: { en: 'Northern Taiwan', zh: '北部' },
        central: { en: 'Central Taiwan', zh: '中部' },
        south: { en: 'Southern Taiwan', zh: '南部' },
        east: { en: 'Eastern Taiwan', zh: '東部' }
      };
      return isZh ? names[region].zh : names[region].en;
    }

    function renderList() {
      const terminals = getFilteredTerminals();
      const listEl = document.getElementById('station-list');

      listEl.innerHTML = terminals.map(terminal => `
        <li class="station-item${selectedTerminal === terminal.id ? ' selected' : ''}" data-id="${terminal.id}">
          <div class="station-header">
            <span class="station-type-badge ${terminal.region}">${getRegionName(terminal.region)}</span>
            <span class="station-name">${getName(terminal)}</span>
          </div>
          <div class="station-details">${getCity(terminal)} - ${getAddress(terminal)}</div>
          <div class="station-operators">${getOperators(terminal)}</div>
        </li>
      `).join('');

      listEl.querySelectorAll('.station-item').forEach(item => {
        item.addEventListener('click', () => selectTerminal(item.dataset.id));
      });
    }

    function selectTerminal(id) {
      selectedTerminal = id;
      const terminal = TERMINALS.find(t => t.id === id);
      if (terminal && markers[id]) {
        map.setView([terminal.lat, terminal.lng], 15);
        markers[id].openPopup();
      }
      renderList();
    }

    function getPopupContent(terminal) {
      return `<div style="text-align:center;">
        <strong>${getName(terminal)}</strong><br>
        <small>${getCity(terminal)}</small><br>
        ${getAddress(terminal)}<br>
        <em style="font-size:0.85em;color:#7b1fa2;">${getOperators(terminal)}</em>
      </div>`;
    }

    function updatePopups() {
      TERMINALS.forEach(terminal => {
        if (markers[terminal.id]) {
          markers[terminal.id].setPopupContent(getPopupContent(terminal));
        }
      });
    }

    function updateMarkers() {
      const filtered = getFilteredTerminals();
      TERMINALS.forEach(terminal => {
        if (markers[terminal.id]) {
          const isVisible = filtered.some(t => t.id === terminal.id);
          if (isVisible) {
            markers[terminal.id].addTo(map);
          } else {
            map.removeLayer(markers[terminal.id]);
          }
        }
      });
    }

    function createMarkerIcon() {
      return L.divIcon({
        className: '',
        html: `<div class="marker-icon" style="width:28px;height:28px;">🚌</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    function initMap() {
      map = L.map('map-canvas').setView([23.8, 121.0], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(map);

      TERMINALS.forEach(terminal => {
        const marker = L.marker([terminal.lat, terminal.lng], {
          icon: createMarkerIcon()
        });
        marker.bindPopup(getPopupContent(terminal));
        marker.on('click', () => {
          selectedTerminal = terminal.id;
          renderList();
          document.querySelector(`.station-item[data-id="${terminal.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        marker.addTo(map);
        markers[terminal.id] = marker;
      });
    }

    function init() {
      const savedLang = localStorage.getItem('ubike-lang');
      if (savedLang) {
        isZh = savedLang === 'zh';
      }
      initMap();
      updateUI();

      document.getElementById('search-input').addEventListener('input', handleSearch);

      // Initialize bottom sheet (mobile only)
      const panel = document.getElementById('panel');
      if (panel && typeof BottomSheet !== 'undefined') {
        bottomSheet = new BottomSheet(panel, {
          initialSnap: 'collapsed',
          onSnapChange: (snap) => {
            console.log('[Bus] Sheet snap:', snap);
          }
        });
      }

      updateSheetSummary();
      console.log('[Bus] Initialized with', TERMINALS.length, 'terminals');
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
