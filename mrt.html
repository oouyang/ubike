    }
    h1 {

    }
    .header-controls {

    }
    .nav-btn {
      padding: 6px 10px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      font-size: 12px;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.3); }
    .nav-btn.active { background: rgba(255,255,255,0.4); font-weight: bold; }
    .nav-btn.home { background: #FF9800; border-color: #FF9800; }
    .nav-btn.home:hover { background: #F57C00; }
    #lang-btn {
      padding: 6px 12px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    #lang-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .station-distance {
      font-size: 0.75em;
      color: #666;
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: auto;
    }
    .container {
      display: flex;
      height: calc(100vh - 52px);
    }
    #panel {
      width: 380px;
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid #ccc;
      background: #f9f9f9;
    }
    #map-canvas {
      flex: 1;
      height: 100%;
    }
    .search-box {
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .search-box input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .search-box select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .station-list {
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .station-item {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .station-item:hover {
      background: #e3f2fd;
    }
    .station-item.selected {
      background: #bbdefb;
    }
    .station-name {
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .station-id {
      font-size: 0.75em;
      background: #666;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .station-address {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 4px;
    }
    .line-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.75em;
      color: white;
      font-weight: bold;
    }
    .result-count {
      padding: 8px 15px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      font-size: 0.85em;
      color: #666;
    }

    .line-R { background-color: #e3002c; }
    .line-G { background-color: #008659; }
    .line-O { background-color: #f8b61c; }
    .line-BL { background-color: #0070bd; }
    .line-Y { background-color: #ffdb00; color: #333; }
    .line-LG { background-color: #a1d884; color: #333; }

    .line-KR { background-color: #e20a17; }
    .line-KO { background-color: #faa73e; }
    .line-KC { background-color: #92d050; color: #333; }
    /* Taoyuan */
    .line-A { background-color: #7b5bb3; }
    /* Taichung */
    .line-TG { background-color: #0aa06e; }

    .marker-icon {

      justify-content: center;
      font-size: 10px;

const CONFIG = {
  DEFAULT_CENTER: [25.0330, 121.5654],
  DEFAULT_ZOOM: 12
};

// State
let map = null;
let markers = {};
let stations = [...STATIONS];
let currentSystem = 'TRTC';
let currentLine = 'all';
let selectedStation = null;
let isZh = (navigator.language || navigator.userLanguage).startsWith('zh');
let userLocation = null;

// Distance calculation utilities
const deg2rad = (deg) => deg * (Math.PI / 180);

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = deg2rad(lat2 - lat1);
  const dLon = deg2rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
    Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function formatDistance(meters) {
  if (meters < 1000) return `${Math.round(meters)} m`;
  return `${(meters / 1000).toFixed(1)} km`;
}

function isChineseLocale() {
  return isZh;
}

function toggleLang() {
  isZh = !isZh;
  localStorage.setItem('ubike-lang', isZh ? 'zh' : 'en');
  updateUI();
}

function updateUI() {
  // Update page title
  document.getElementById('page-title').textContent = isZh ? '台灣捷運' : 'Taiwan MRT';

  // Update search placeholder
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.placeholder = isZh ? '搜尋車站...' : 'Search stations...';
  }

  // Update navigation buttons
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const text = isZh ? btn.dataset.zh : btn.dataset.en;
    if (text) btn.textContent = text;
  });

  // Update system select options
  const systemSelect = document.getElementById('system-select');
  if (systemSelect) {
    systemSelect.options[0].textContent = isZh ? '全部系統' : 'All Systems';
    Array.from(systemSelect.options).forEach(option => {
      if (option.value !== 'all' && MRT_SYSTEMS[option.value]) {
        option.textContent = isZh ? MRT_SYSTEMS[option.value].name.zh : MRT_SYSTEMS[option.value].name.en;
      }
    });
  }

  // Update line select options
  updateLineSelect();

  // Re-render station list and update popups
  const filtered = filterStations();
  renderStationList(filtered);

  // Update all marker popups
  Object.keys(markers).forEach(id => {
    const station = STATIONS.find(s => s.id === id);
    if (station && markers[id]) {
      markers[id].setPopupContent(getPopupContent(station));
    }
  });
}

function getSystemInfo(systemCode) {
  return MRT_SYSTEMS[systemCode] || { name: { en: systemCode, zh: systemCode }, lines: {} };
}

function getLineInfo(systemCode, lineCode) {
  const system = MRT_SYSTEMS[systemCode];
  return system?.lines[lineCode] || { name: { en: lineCode, zh: lineCode }, color: '#666' };
}

function getStationName(station) {
  return isChineseLocale() ? station.name.zh : station.name.en;
}

function getLineName(systemCode, lineCode) {
  const lineInfo = getLineInfo(systemCode, lineCode);
  return isChineseLocale() ? lineInfo.name.zh : lineInfo.name.en;
}

function getSystemName(systemCode) {
  const systemInfo = getSystemInfo(systemCode);
  return isChineseLocale() ? systemInfo.name.zh : systemInfo.name.en;
}

function createMarkerIcon(lineCode, systemCode) {
  const lineInfo = getLineInfo(systemCode, lineCode);
  return L.divIcon({
    className: '',
    html: `<div class="marker-icon" style="width:20px;height:20px;background-color:${lineInfo.color};">${lineCode.substring(0, 2)}</div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -10]
  });
}

function getPopupContent(station) {
  const isZh = isChineseLocale();
  const systemName = getSystemName(station.system);
  const lineName = getLineName(station.system, station.line);

  let distanceHtml = '';
  if (userLocation && station.lat && station.lng) {
    const distance = getDistanceInMeters(userLocation.lat, userLocation.lng, station.lat, station.lng);
    distanceHtml = `<br>${isZh ? '距離' : 'Distance'}: ${formatDistance(distance)}`;
  }

  const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}`;
  const appleMapsUrl = `http://maps.apple.com/?daddr=${station.lat},${station.lng}`;
  const btnStyle = 'display:inline-block;padding:4px 8px;margin:2px;background:#0072c6;color:white;text-decoration:none;border-radius:4px;font-size:11px;';

  return `<div>
    <strong>${getStationName(station)}</strong><br>
    <small>${station.id}</small><br>
    ${isZh ? '系統' : 'System'}: ${systemName}<br>
    ${isZh ? '路線' : 'Line'}: ${lineName}<br>
    ${station.address || ''}${distanceHtml}
    <div style="margin-top:8px;">
      <a href="${googleMapsUrl}" target="_blank" style="${btnStyle}">${isZh ? 'Google導航' : 'Google Maps'}</a>
      <a href="${appleMapsUrl}" target="_blank" style="${btnStyle}">${isZh ? 'Apple導航' : 'Apple Maps'}</a>
    </div>
  </div>`;
}

function createStationListItem(station) {
  const lineInfo = getLineInfo(station.system, station.line);
  const lineName = getLineName(station.system, station.line);
  let distanceHtml = '';
  if (userLocation && station.lat && station.lng) {
    const distance = getDistanceInMeters(userLocation.lat, userLocation.lng, station.lat, station.lng);
    distanceHtml = `<span class="station-distance">${formatDistance(distance)}</span>`;
  }

  return `
    <li class="station-item" data-id="${station.id}" data-system="${station.system}">
      <div class="station-name">
        <span class="station-id" style="background-color:${lineInfo.color}">${station.id}</span>
        ${getStationName(station)}
        ${distanceHtml}
      </div>
      <div class="station-address">
        <span class="line-badge line-${station.line}">${lineName}</span>
        ${station.address || ''}
      </div>
    </li>
  `;
}

function addMarkers(stationList) {
  Object.values(markers).forEach(marker => map.removeLayer(marker));
  markers = {};

  stationList.forEach(station => {
    if (!station.lat || !station.lng) return;
    const marker = L.marker([station.lat, station.lng], {
      icon: createMarkerIcon(station.line, station.system)
    });

    marker.bindPopup(getPopupContent(station));
    marker.on('click', () => selectStation(station.id, station.system));
    marker.addTo(map);
    markers[`${station.system}-${station.id}`] = marker;
  });

  console.log(`[MRT] Added ${Object.keys(markers).length} markers`);
}

function renderStationList(stationList) {
  const listEl = document.getElementById('station-list');
  const countEl = document.getElementById('result-count');
  const isZh = isChineseLocale();

  listEl.innerHTML = stationList.map(createStationListItem).join('');
  countEl.textContent = isZh
    ? `顯示 ${stationList.length} 個車站`
    : `Showing ${stationList.length} stations`;

  listEl.querySelectorAll('.station-item').forEach(item => {
    item.addEventListener('click', () => {
      selectStation(item.dataset.id, item.dataset.system);
    });
  });
}

function selectStation(id, system) {
  document.querySelectorAll('.station-item.selected').forEach(el => {
    el.classList.remove('selected');
  });

  const listItem = document.querySelector(`.station-item[data-id="${id}"][data-system="${system}"]`);
  if (listItem) {
    listItem.classList.add('selected');
    listItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const marker = markers[`${system}-${id}`];
  if (marker) {
    map.setView(marker.getLatLng(), 15);
    marker.openPopup();
  }

  selectedStation = { id, system };
  console.log(`[MRT] Selected station: ${system}-${id}`);
}

function filterStations() {
  let filtered = [...STATIONS];

  // Filter by system
  if (currentSystem !== 'all') {
    filtered = filtered.filter(s => s.system === currentSystem);
  }

  // Filter by line
  if (currentLine !== 'all') {
    filtered = filtered.filter(s => s.line === currentLine);
  }

  // Filter by search query
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  if (query) {
    filtered = filtered.filter(station => {
      const nameZh = station.name.zh.toLowerCase();
      const nameEn = station.name.en.toLowerCase();
      const address = (station.address || '').toLowerCase();
      const id = station.id.toLowerCase();
      return nameZh.includes(query) || nameEn.includes(query) || address.includes(query) || id.includes(query);
    });
  }

  return filtered;
}

function updateLineSelect() {
  const lineSelect = document.getElementById('line-select');
  const isZh = isChineseLocale();

  let options = '<option value="all">' + (isZh ? '所有路線' : 'All Lines') + '</option>';

  if (currentSystem !== 'all' && MRT_SYSTEMS[currentSystem]) {
    const system = MRT_SYSTEMS[currentSystem];
    Object.entries(system.lines).forEach(([code, info]) => {
      const lineName = isZh ? info.name.zh : info.name.en;
      options += `<option value="${code}">${lineName}</option>`;
    });
  }

  lineSelect.innerHTML = options;
  currentLine = 'all';
}

function changeSystem() {
  const select = document.getElementById('system-select');
  currentSystem = select.value;
  localStorage.setItem('mrt-system', currentSystem);
  console.log(`[MRT] System changed to: ${currentSystem}`);

  updateLineSelect();

  const filtered = filterStations();
  renderStationList(filtered);
  addMarkers(filtered);

  // Pan to system center
  if (currentSystem !== 'all' && MRT_SYSTEMS[currentSystem]) {
    map.setView(MRT_SYSTEMS[currentSystem].center, CONFIG.DEFAULT_ZOOM);
  }
}

function changeLine() {
  const select = document.getElementById('line-select');
  currentLine = select.value;
  console.log(`[MRT] Line changed to: ${currentLine}`);

  const filtered = filterStations();
  renderStationList(filtered);
  addMarkers(filtered);
}

function handleSearch(e) {
  const filtered = filterStations();
  renderStationList(filtered);
  addMarkers(filtered);
  console.log(`[MRT] Search: "${e.target.value}" - ${filtered.length} results`);
}

async function initialize() {
  console.log('[MRT] Initializing MRT map...');

  // Restore language preference
  const savedLang = localStorage.getItem('ubike-lang');
  if (savedLang) {
    isZh = savedLang === 'zh';
  }

  // Restore system preference
  const savedSystem = localStorage.getItem('mrt-system');
  if (savedSystem && (MRT_SYSTEMS[savedSystem] || savedSystem === 'all')) {
    currentSystem = savedSystem;
    document.getElementById('system-select').value = currentSystem;
  }

  // Get user location
  if ('geolocation' in navigator) {
    try {
      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
      });
      userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
      console.log('[MRT] User location:', userLocation);
    } catch (error) {
      console.warn('[MRT] Could not get location:', error.message);
    }
  }

  // Update UI with language
  updateUI();

  // Create map
  const center = MRT_SYSTEMS[currentSystem]?.center || CONFIG.DEFAULT_CENTER;
  map = L.map('map-canvas').setView(center, CONFIG.DEFAULT_ZOOM);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  // Setup search
  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', handleSearch);

  // Initial load
  const filtered = filterStations();
  renderStationList(filtered);
  addMarkers(filtered);

  console.log('[MRT] MRT map initialized successfully');
}

document.addEventListener('DOMContentLoaded', initialize);
  </script>
</body>
</html>
