<script>
// ===== DATA LOADING =====
const bankData = [

  {id:'0052', name:'富邦台灣科技', bank:'台新', link:'https://etrade.fsit.com.tw/Event/ETFdividend/index.aspx'},
  {id:'00946', name:'群益科技高息成長', bank:'中國信託', link:'https://www.capitalfund.com.tw/etfdividend'},
  {id:'00865B', name:'國泰US短期公債', bank:'中國信託', link:'https://www.cathaysite.com.tw/proj/2021/afa/'},
  {id:'00881', name:'國泰台灣5G+', bank:'第一'},
  {id:'00882', name:'中信中國高股息', bank:'兆豐'},
  {id:'00888', name:'永豐台灣ESG', bank:'合庫'},
  {id:'00893', name:'國泰電動車', bank:'兆豐'},
  {id:'00900', name:'富邦特選高股息30', bank:'永豐'},
  {id:'00907', name:'永豐優息存股', bank:'台灣'},
  {id:'00919', name:'群益台灣精選高息', bank:'中國信託', link:'https://www.capitalfund.com.tw/etfdividend'},
  {id:'00929', name:'復華台灣科技優息', bank:'富邦', link:'https://www.fhtrust.com.tw/ETF_custService/'},
  {id:'00924', name:'復華S&P500成長', bank:'富邦', link:'https://www.fhtrust.com.tw/ETF_custService/'},
  {id:'00918', name:'大華優利高填息30', bank:'台灣中小企業銀行'},
  {id:'00936', name:'台新永續高息中小', bank:'兆豐'},
  {id:'00935', name:'野村臺灣新科技50', bank:'永豐'},
  {id:'00850', name:'元大臺灣ESG永續', bank:'永豐'},
  {id:'00933b', name:'群益ESG投等債20+', bank:'彰化'},
  {id:'00941', name:'中信上游半導體', bank:'兆豐'},
  {id:'00943', name:'兆豐台灣電子成長高息', bank:'兆豐'}
];

// Build BWIBBU lookup map
const bwibbuMap = {};
(window.BWIBBU_DATA || []).forEach(d => {
  bwibbuMap[d.Code] = { pe: d.PEratio, yield: d.DividendYield, pb: d.PBratio, price: d.ClosePrice };
});

// ETF classification
function classifyETF(s) {
  const n = s.name.toLowerCase();
  const id = s.id.toLowerCase();
  if (n.includes('正') || n.includes('反') || id.endsWith('l') || id.endsWith('r')) return '槓桿反向';
  if (n.includes('債') || id.endsWith('b')) return '債券型';
  if (n.includes('息') || n.includes('股利') || n.includes('股息') || n.includes('配息')) return '高股息型';
  // International first (before 市值型 catches "50" ETFs)
  if (n.includes('nasdaq') || n.includes('s&p') || n.includes('日經') || n.includes('中國') || n.includes('美國') || n.includes('歐洲') || n.includes('印度') || n.includes('東協') || n.includes('恒') || n.includes('滬深') || n.includes('上証') || n.includes('深証') || n.includes('寶滬深') || n.includes('a50')) return '國際型';
  // 市值型: keywords + "50" suffix + known market-cap index names
  if (n.includes('市值') || n.includes('卓越') || n.includes('龍頭') || n.includes('領袖') || n.includes('中型') || n.includes('摩台') || n.includes('新台灣') || n.includes('富櫃') || /[0-9]50$/.test(id) || id === '0050') return '市值型';
  if (n.includes('科技') || n.includes('半導體') || n.includes('電動車') || n.includes('5g') || n.includes('金融') || n.includes('生技') || n.includes('能源') || n.includes('工業') || n.includes('通訊') || n.includes('消費') || n.includes('電子') || n.includes('發達')) return '產業型';
  if (n.includes('esg') || n.includes('永續') || n.includes('成長') || n.includes('價值') || n.includes('動能') || n.includes('非投等')) return '主題型';
  // Last resort: id pattern heuristics
  if (id.match(/^005[0-9]/) || id.match(/^006[0-9]/) || id.match(/^008[0-9]/) && !n.includes('息')) return '市值型';
  return '其他';
}

// Merge stocks_data with bwibbu data + classification
function buildMerged() {
  const stocks = window.STOCK_DATA || [];
  return stocks.map(s => {
    const b = bwibbuMap[s.id] || {};
    const isETF = s.industry === 'ETF' || s.industry === '上櫃ETF' || s.industry === '上櫃指數股票型基金(ETF)';
    return {
      id: s.id,
      name: s.name,
      industry: s.industry,
      market: s.market,
      pe: b.pe || '',
      yield: b.yield || '',
      pb: b.pb || '',
      price: b.price || '',
      isETF: isETF,
      category: isETF ? classifyETF(s) : ''
    };
  });
}

// ===== UTILITY =====
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function dailyLink(id) { return 'https://goodinfo.tw/tw/ShowK_Chart.asp?STOCK_ID='+id; }
function weeklyLink(id) { return dailyLink(id)+'&CHT_CAT=WEEK&PRICE_ADJ=F&SCROLL2Y=100&SCROLL2Y=100'; }
function numOrDash(v) { return v && v !== '-' ? v : '-'; }
function sortVal(row, key) {
  const v = row[key];
  if (key === 'price' || key === 'pe' || key === 'yield' || key === 'pb') {
    const n = parseFloat(v);
    return isNaN(n) ? -999999 : n;
  }
  if (key === 'market') { return {twse:0, tpex:1, emerging:2}[v]||9; }
  return typeof v === 'string' ? v.toLowerCase() : String(v);
}

function bankBadge(bank) {
  if (!bank) return '';
  const cls = 'bank-badge bank-' + bank.replace(/\s+/g, '');
  return '<span class="'+cls+'">'+esc(bank)+'</span>';
}
function marketBadge(m) {
  const labels = {twse:'上市', tpex:'上櫃', emerging:'興櫃'};
  const label = labels[m] || m;
  return '<span class="market-badge market-'+m+'">'+label+'</span>';
}
function catBadge(c) {
  if (!c) return '';
  return '<span class="cat-badge cat-'+c+'">'+esc(c)+'</span>';
}
function chartLinks(id) {
  return '<span class="link-group"><a href="'+dailyLink(id)+'" target="_blank">日</a> <a href="'+weeklyLink(id)+'" target="_blank">週</a></span>';
}

// ===== SORTING =====
const sortState = {};
function toggleSort(tableId, key) {
  const state = sortState[tableId] || {key:null, dir:0};
  if (state.key === key) {
    if (state.dir === 1) state.dir = -1;
    else if (state.dir === -1) { state.dir = 0; state.key = null; }
    else { state.dir = 1; state.key = key; }
  } else {
    state.key = key; state.dir = 1;
  }
  sortState[tableId] = state;
  return state;
}
function getSorter(tableId, rows) {
  const st = sortState[tableId];
  if (!st || !st.key || !st.dir) return rows;
  const key = st.key;
  return rows.slice().sort((a,b) => {
    const va = sortVal(a, key), vb = sortVal(b, key);
    return va < vb ? -st.dir : va > vb ? st.dir : 0;
  });
}
function updateSortIndicators(tableId) {
  const st = sortState[tableId];
  document.querySelectorAll('#tab-'+tableId+' th[data-sort]').forEach(th => {
    th.classList.toggle('sorted', st && th.dataset.sort === st.key);
    const sp = th.querySelector('.sort');
    if (sp) sp.textContent = st && th.dataset.sort === st.key ? (st.dir === 1 ? '▲' : '▼') : '▲';
  });
}

// ===== TAB 1: 保管銀行 =====
let _bankFilter = '';
function renderBank() {
  const q = _bankFilter.toLowerCase().trim();
  const rows = bankData.filter(d => !q || d.id.toLowerCase().includes(q) || d.name.toLowerCase().includes(q));
  const eb = document.getElementById('bankEmpty');
  const tb = document.getElementById('bankBody');
  if (!rows.length) { tb.innerHTML=''; eb.style.display='block'; return; }
  eb.style.display='none';
  tb.innerHTML = rows.map(d => {
    const nh = d.link ? '<a href="'+esc(d.link)+'" target="_blank">'+esc(d.name)+'</a>' : esc(d.name);
    return '<tr><td><a href="'+dailyLink(d.id)+'" target="_blank">'+esc(d.id)+'</a></td><td>'+nh+'</td><td>'+bankBadge(d.bank)+'</td></tr>';
  }).join('');
}

// ===== TAB 2: 全市場 =====
let _marketRows = [], _marketFiltered = [];
function renderMarket() {
  const q = (document.getElementById('marketSearch').value||'').toLowerCase().trim();
  const ind = document.getElementById('marketIndustry').value;
  const tp = document.getElementById('marketType').value;
  let rows = _marketRows.filter(d => {
    if (ind && d.industry !== ind) return false;
    if (tp && d.market !== tp) return false;
    if (q && !d.id.toLowerCase().includes(q) && !d.name.toLowerCase().includes(q)) return false;
    return true;
  });
  _marketFiltered = rows;
  rows = getSorter('market', rows);
  const tb = document.getElementById('marketBody');
  const eb = document.getElementById('marketEmpty');
  if (!rows.length) { tb.innerHTML=''; eb.style.display='block'; return; }
  eb.style.display='none';
  updateSortIndicators('market');
  tb.innerHTML = rows.map(d => {
    const pe = d.pe ? '<span class="num-muted">'+esc(numOrDash(d.pe))+'</span>' : '<span class="num-muted">-</span>';
    const yi = d.yield ? esc(numOrDash(d.yield)) : '<span class="num-muted">-</span>';
    const pb = d.pb ? esc(numOrDash(d.pb)) : '<span class="num-muted">-</span>';
    return '<tr><td><a href="'+dailyLink(d.id)+'" target="_blank">'+esc(d.id)+'</a></td><td>'+esc(d.name)+'</td><td>'+esc(d.industry)+'</td><td>'+marketBadge(d.market)+'</td><td class="num">'+pe+'</td><td class="num">'+yi+'</td><td class="num">'+pb+'</td><td>'+chartLinks(d.id)+'</td></tr>';
  }).join('');
}

// ===== TAB 3: ETF總覧 =====
let _etfRows = [], _etfFiltered = [];
function renderETF() {
  const q = (document.getElementById('etfSearch').value||'').toLowerCase().trim();
  const cat = document.getElementById('etfCategory').value;
  let rows = _etfRows.filter(d => {
    if (cat && d.category !== cat) return false;
    if (q && !d.id.toLowerCase().includes(q) && !d.name.toLowerCase().includes(q)) return false;
    return true;
  });
  _etfFiltered = rows;
  rows = getSorter('etf', rows);
  const tb = document.getElementById('etfBody');
  const eb = document.getElementById('etfEmpty');
  if (!rows.length) { tb.innerHTML=''; eb.style.display='block'; return; }
  eb.style.display='none';
  updateSortIndicators('etf');
  tb.innerHTML = rows.map(d => {
    const pr = d.price ? esc(numOrDash(d.price)) : '<span class="num-muted">-</span>';
    const pe = d.pe ? '<span class="num-muted">'+esc(numOrDash(d.pe))+'</span>' : '<span class="num-muted">-</span>';
    const yi = d.yield ? esc(numOrDash(d.yield)) : '<span class="num-muted">-</span>';
    const pb = d.pb ? esc(numOrDash(d.pb)) : '<span class="num-muted">-</span>';
    return '<tr><td><a href="'+dailyLink(d.id)+'" target="_blank">'+esc(d.id)+'</a></td><td>'+esc(d.name)+'</td><td>'+catBadge(d.category)+'</td><td>'+marketBadge(d.market)+'</td><td class="num">'+pr+'</td><td class="num">'+pe+'</td><td class="num">'+yi+'</td><td class="num">'+pb+'</td><td>'+chartLinks(d.id)+'</td></tr>';
  }).join('');
}

// ===== TAB 4: 搜尋 =====
function renderSearch() {
  const q = (document.getElementById('globalSearch').value||'').toLowerCase().trim();
  const all = window._allRows || [];
  const tb = document.getElementById('searchBody');
  const eb = document.getElementById('searchEmpty');
  if (!q) { tb.innerHTML=''; eb.style.display='block'; eb.textContent='輸入代碼或名稱開始搜尋'; return; }
  const rows = all.filter(d => d.id.toLowerCase().includes(q) || d.name.toLowerCase().includes(q));
  if (!rows.length) { tb.innerHTML=''; eb.style.display='block'; eb.textContent='未找到結果'; return; }
  eb.style.display='none';
  tb.innerHTML = rows.map(d => {
    const pe = d.pe ? esc(numOrDash(d.pe)) : '-';
    const yi = d.yield ? esc(numOrDash(d.yield)) : '-';
    const catHtml = d.isETF ? catBadge(d.category) : '';
    return '<tr><td><a href="'+dailyLink(d.id)+'" target="_blank">'+esc(d.id)+'</a></td><td>'+esc(d.name)+'</td><td>'+esc(d.industry)+'</td><td>'+marketBadge(d.market)+'</td><td>'+catHtml+'</td><td class="num">'+pe+'</td><td class="num">'+yi+'</td><td>'+chartLinks(d.id)+'</td></tr>';
  }).join('');
}

// ===== TAB SWITCHING =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    const inp = document.querySelector('#tab-'+btn.dataset.tab+' .search-bar');
    if (inp) setTimeout(() => inp.focus(), 100);
  });
});

// ===== SORTING EVENT =====
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const tbl = th.closest('table');
  const tab = tbl && tbl.closest('[id^="tab-"]');
  if (!tab) return;
  const tid = tab.id.replace('tab-','');
  toggleSort(tid, th.dataset.sort);
  if (tid === 'market') renderMarket();
  else if (tid === 'etf') renderETF();
});

// ===== SEARCH INPUTS =====
document.getElementById('bankSearch').addEventListener('input', function() {
  _bankFilter = this.value; renderBank();
});
document.getElementById('marketSearch').addEventListener('input', renderMarket);
document.getElementById('marketIndustry').addEventListener('change', renderMarket);
document.getElementById('marketType').addEventListener('change', renderMarket);
document.getElementById('etfSearch').addEventListener('input', renderETF);
document.getElementById('etfCategory').addEventListener('change', renderETF);
document.getElementById('globalSearch').addEventListener('input', (function(){
  let timer;
  return function() {
    clearTimeout(timer);
    timer = setTimeout(renderSearch, 300);
  };
})());

// ===== INIT =====
function init() {
  const all = buildMerged();
  window._allRows = all;

  // Populate industry filter
  const inds = [...new Set(all.map(d => d.industry).filter(Boolean).sort())];
  const sel = document.getElementById('marketIndustry');
  inds.forEach(i => { const o = document.createElement('option'); o.value=i; o.textContent=i; sel.appendChild(o); });

  // Populate ETF category filter
  const cats = [...new Set(all.filter(d => d.isETF).map(d => d.category).filter(Boolean).sort())];
  const csel = document.getElementById('etfCategory');
  cats.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; csel.appendChild(o); });

  // Market rows (exclude ETFs for market tab? No, include everything)
  _marketRows = all.filter(d => {
    // Skip index entries
    if (d.industry === 'Index' || d.industry === '大盤') return false;
    return true;
  });
  _etfRows = all.filter(d => d.isETF);

  // Counts
  document.getElementById('bankCount').textContent = bankData.length;
  document.getElementById('marketCount').textContent = _marketRows.length;
  document.getElementById('etfCount').textContent = _etfRows.length;
  document.getElementById('totalCount').textContent = all.length+' 檔';

  // Default ETF tab sort: yield descending (so ETFs WITH data appear first)
  sortState['etf'] = { key: 'yield', dir: -1 };

  // Initial renders
  renderBank();
  renderMarket();
  renderETF();
}

init();
</script>
