// Utilities
const deg2rad = (deg) => deg * (Math.PI / 180);

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = deg2rad(lat2 - lat1);
  const dLon = deg2rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
    Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function formatDistance(meters) {
  if (meters < 1000) return `${Math.round(meters)} m`;
  return `${(meters / 1000).toFixed(1)} km`;
}

function formatTime(minutes) {
  const h = Math.floor(minutes / 60) % 24;
  const m = minutes % 60;
  return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
}

function getCurrentMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function getCountdown(departureMinutes) {
  const now = getCurrentMinutes();
  let diff = departureMinutes - now;
  if (diff < 0) diff += 24 * 60; // next day
  if (diff < 1) return isZh ? '即將發車' : 'Departing';
  if (diff < 60) return `${diff} ${isZh ? '分鐘' : 'min'}`;
  const h = Math.floor(diff / 60);
  const m = diff % 60;
  return `${h}${isZh ? '時' : 'h'} ${m}${isZh ? '分' : 'm'}`;
}

function updateStationSelector() {
  const select = document.getElementById('station-select');

  select.innerHTML = `<option value="">${isZh ? '-- 選擇車站 --' : '-- Select Station --'}</option>`;

    const name = isZh ? s.name.zh : s.name.en;
    select.innerHTML += `<option value="${s.id}">${name}</option>`;
  });
  select.value = currentValue;
}

function getStationIndex(station) {
  return STATIONS.findIndex(s => s.id === station.id) + 1;

  const stationId = document.getElementById('station-select').value;
  if (stationId) {
    const station = STATIONS.find(s => s.id === stationId);
    if (station) {
      selectStation(stationId);
    }
  }
  renderTrainSchedule();
}

function getTrainsForStation(stationId, direction) {
  const stationIndex = STATIONS.findIndex(s => s.id === stationId);
  if (stationIndex === -1) return [];

  const schedule = direction === 'south' ? TRAIN_SCHEDULE_BASE.southbound : TRAIN_SCHEDULE_BASE.northbound;
  const now = getCurrentMinutes();

  const trains = schedule.map(train => {
    const depTime = train.times[stationIndex];
    if (depTime === undefined) return null;

    // Determine destination
    let destStation;
    if (direction === 'south') {
      destStation = STATIONS[STATIONS.length - 1]; // Zuoying
    } else {
      destStation = STATIONS[0]; // Nangang
    }

    const isDeparted = depTime < now && (now - depTime) < 120; // within 2 hours ago
    const diff = depTime - now;
    const isArriving = diff >= 0 && diff <= 5;

    return {
      trainNo: train.trainNo,
      depTime: depTime,
      depTimeStr: formatTime(depTime),
      destination: destStation,
      isDeparted: depTime < now && diff < -5,
      isArriving: isArriving,
      countdown: getCountdown(depTime)
    };
  }).filter(t => t !== null);

  // Sort by departure time, show next 10 trains
  return trains
    .filter(t => !t.isDeparted || (getCurrentMinutes() - t.depTime) < 5)
    .sort((a, b) => {
      // Handle day wraparound
      const aNorm = a.depTime < now - 120 ? a.depTime + 1440 : a.depTime;
      const bNorm = b.depTime < now - 120 ? b.depTime + 1440 : b.depTime;
      return aNorm - bNorm;
    })
    .slice(0, 10);
}

function renderTrainSchedule() {
  const listEl = document.getElementById('train-list');
  const stationId = document.getElementById('station-select').value;

  // Update current time
  const now = new Date();
  document.getElementById('current-time').textContent = now.toLocaleTimeString(isZh ? 'zh-TW' : 'en-US', { hour: '2-digit', minute: '2-digit' });

  if (!stationId) {
    listEl.innerHTML = `<li class="no-trains">${isZh ? '請選擇車站查看時刻表' : 'Select a station to view schedule'}</li>`;
    return;
  }

  const station = STATIONS.find(s => s.id === stationId);

  // Check if this is terminal station
  const stationIndex = STATIONS.findIndex(s => s.id === stationId);
  if ((currentDirection === 'south' && stationIndex === STATIONS.length - 1) ||
      (currentDirection === 'north' && stationIndex === 0)) {
    listEl.innerHTML = `<li class="no-trains">${isZh ? '此為終點站，無此方向列車' : 'Terminal station - no trains in this direction'}</li>`;
    return;
  }

  const trains = getTrainsForStation(stationId, currentDirection);

  if (trains.length === 0) {
    listEl.innerHTML = `<li class="no-trains">${isZh ? '目前無列車資訊' : 'No train information available'}</li>`;
    return;
  }

  listEl.innerHTML = trains.map(train => {
    const destName = isZh ? train.destination.name.zh : train.destination.name.en;
    let statusClass = 'ontime';
    let statusText = isZh ? '準點' : 'On time';

    if (train.isArriving) {
      statusClass = 'arriving';
      statusText = isZh ? '即將到站' : 'Arriving';
    }

    return `
      <li class="train-item${train.isDeparted ? ' departed' : ''}">
        <div class="train-time">${train.depTimeStr}</div>
        <div class="train-info">
          <div class="train-number">${train.trainNo}</div>
          <div class="train-dest">${isZh ? '往' : 'To'} ${destName}</div>
        </div>
        <div class="train-status ${statusClass}">${statusText}</div>
        <div class="train-countdown">${train.countdown}</div>
      </li>
    `;
  }).join('');
}

// Station List Functions
function renderStationList() {
  const listEl = document.getElementById('station-list');
  const query = document.getElementById('search-input').value.toLowerCase().trim();

  let filtered = STATIONS;
  if (query) {
    filtered = STATIONS.filter(s =>
      s.name.en.toLowerCase().includes(query) ||
      s.name.zh.includes(query) ||
      s.address.en.toLowerCase().includes(query) ||
      s.address.zh.includes(query)
    );
  }

  listEl.innerHTML = filtered.map(station => {
    const index = getStationIndex(station);
    let distanceHtml = '';
    if (userLocation) {
      const dist = getDistanceInMeters(userLocation.lat, userLocation.lng, station.lat, station.lng);
      distanceHtml = `<span class="station-distance">${formatDistance(dist)}</span>`;
    }

    return `
      <li class="station-item${selectedStation === station.id ? ' selected' : ''}" data-id="${station.id}">
        <div class="station-name">
          <span class="station-number">${index}</span>
          ${getStationName(station)}
          ${distanceHtml}
        </div>
        <div class="station-info">
          ${getAddress(station)} • ${station.km} km
        </div>
      </li>
    `;
  }).join('');

  listEl.querySelectorAll('.station-item').forEach(item => {
    item.addEventListener('click', () => {
      selectStation(item.dataset.id);
      document.getElementById('station-select').value = item.dataset.id;
      document.querySelector('[data-tab="schedule"]').click();
      renderTrainSchedule();
    });
  });
}

function selectStation(id) {
  selectedStation = id;
  document.querySelectorAll('.station-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });

  const marker = markers[id];
  if (marker) {
    map.setView(marker.getLatLng(), 12);
    marker.openPopup();
  }

  renderStationList();
}

// Map Functions
function createMarkerIcon(index) {
  return L.divIcon({
    className: '',
    html: `<div class="marker-icon" style="width:28px;height:28px;">${index}</div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14]
  });
}

function getPopupContent(station) {
  const index = getStationIndex(station);
  let distanceHtml = '';
  if (userLocation) {
    const dist = getDistanceInMeters(userLocation.lat, userLocation.lng, station.lat, station.lng);
    distanceHtml = `<br>${isZh ? '距離' : 'Distance'}: ${formatDistance(dist)}`;
  }

  const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}`;
  const appleMapsUrl = `http://maps.apple.com/?daddr=${station.lat},${station.lng}`;
  const btnStyle = 'display:inline-block;padding:4px 8px;margin:2px;background:#f57c00;color:white;text-decoration:none;border-radius:4px;font-size:11px;';

  return `<div style="text-align:center;">
    <strong>${getStationName(station)}</strong><br>
    <small>${getAddress(station)}</small><br>
    ${isZh ? '里程' : 'KM'}: ${station.km} km${distanceHtml}
    <div style="margin-top:8px;">
      <a href="${googleMapsUrl}" target="_blank" style="${btnStyle}">${isZh ? 'Google導航' : 'Google Maps'}</a>
      <a href="${appleMapsUrl}" target="_blank" style="${btnStyle}">${isZh ? 'Apple導航' : 'Apple Maps'}</a>
    </div>
  </div>`;
}

function updatePopups() {
  STATIONS.forEach(station => {
    if (markers[station.id]) {
      markers[station.id].setPopupContent(getPopupContent(station));
    }
  });
}

function initMap() {
  map = L.map('map-canvas').setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  // Add markers
  STATIONS.forEach((station, index) => {
    const marker = L.marker([station.lat, station.lng], {
      icon: createMarkerIcon(index + 1)
    });
    marker.bindPopup(getPopupContent(station));
    marker.on('click', () => {
      selectedStation = station.id;
      document.getElementById('station-select').value = station.id;
      renderStationList();
      renderTrainSchedule();
    });
    marker.addTo(map);
    markers[station.id] = marker;
  });

  // Draw route line
  const lineCoords = STATIONS.map(s => [s.lat, s.lng]);
  routeLine = L.polyline(lineCoords, { color: '#f57c00', weight: 4, opacity: 0.7 }).addTo(map);
}

// Tab handling
function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
  });
}

// Initialize
async function initialize() {
  console.log('[THSR] Initializing...');

  const savedLang = localStorage.getItem('ubike-lang');
  if (savedLang) isZh = savedLang === 'zh';

  // Get user location
  if ('geolocation' in navigator) {
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
      });
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      console.log('[THSR] User location:', userLocation);
    } catch (e) {
      console.warn('[THSR] Could not get location');
    }
  }

  setupTabs();
  initMap();
  updateUI();

  // Search handler
  document.getElementById('search-input').addEventListener('input', renderStationList);

  // Update time every minute
  timeUpdateInterval = setInterval(() => {
    if (document.getElementById('station-select').value) {
      renderTrainSchedule();
    }
  }, 60000);

  console.log('[THSR] Initialized');
}

document.addEventListener('DOMContentLoaded', initialize);
  </script>
