<!DOCTYPE html>
<html>

<head>
	<meta charset='UTF-8'>
	<title>ubike site list</title>
	<script>
		'use strict';

		const API_URL = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';

		function isChineseLocale() {
			const userLang = navigator.language || navigator.userLanguage;
			return userLang === 'zh-TW' || userLang === 'zh-CN';
		}

		function buildTableHeader(isZh) {
			if (isZh) {
				return '<table border=1><tr><th>#</th><th>站名</th><th>位置</th><th>緯度</th><th>經度</th><th>可借數</th><th>可停數</th></tr>';
			}
			return '<table border=1><tr><th>#</th><th>Station</th><th>Location</th><th>Lat</th><th>Lng</th><th>Bike #</th><th>Park #</th></tr>';
		}

		function buildTableRow(station, index, isZh) {
			const name = isZh ? station.sna : station.snaen;
			const location = isZh
				? `${station.sarea} ${station.ar}`
				: `${station.sareaen} ${station.aren}`;

			return `<tr>
				<td>${index + 1}</td>
				<td>${name}</td>
				<td>${location}</td>
				<td>${station.latitude}</td>
				<td>${station.longitude}</td>
				<td>${station.available_rent_bikes}</td>
				<td>${station.available_return_bikes}</td>
			</tr>`;
		}

		async function fetchStations() {
			console.log('[UBike] Fetching station data...');
			const response = await fetch(API_URL);
			if (!response.ok) {
				throw new Error(`HTTP ${response.status}: ${response.statusText}`);
			}
			const data = await response.json();
			console.log(`[UBike] Loaded ${data.length} stations`);
			return data;
		}

		function renderTable(stations) {
			const isZh = isChineseLocale();
			console.log(`[UBike] Rendering table (locale: ${isZh ? 'zh' : 'en'})`);

			let html = buildTableHeader(isZh);
			for (let i = 0; i < stations.length; i++) {
				html += buildTableRow(stations[i], i, isZh);
			}
			html += '</table>';

			return html;
		}

		async function init() {
			const container = document.getElementById('ubike');

			try {
				container.innerHTML = '<p>Loading stations...</p>';
				const stations = await fetchStations();
				container.innerHTML = renderTable(stations);
				console.log('[UBike] Table rendered successfully');
			} catch (error) {
				console.error('[UBike] Failed to load stations:', error.message);
				container.innerHTML = `<p style="color: red;">Error loading stations: ${error.message}</p>`;
			}
		}

		document.addEventListener('DOMContentLoaded', init);
	</script>
	<style>
		tr:nth-child(even) {
			background: #CCC
		}
		tr:nth-child(odd) {
			background: #FFF
		}
	</style>
</head>

<body>
	<div id='ubike'></div>
</body>

</html>
