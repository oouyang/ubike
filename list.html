<!DOCTYPE html>
<html>

<head>
	<meta charset='UTF-8'>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
	<meta name="theme-color" content="#4CAF50">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>YouBike Station List</title>
	<link rel="manifest" href="manifest.webapp">
	<link rel="apple-touch-icon" href="img/icon-180.png">
	<script>
		'use strict';

		// Official YouBike API - covers all cities
		const YOUBIKE_API = 'https://apis.youbike.com.tw/json/station-yb2.json';

		// City configurations
		const CITIES = {
			all: { name: { en: 'All Cities', zh: '全部' }, areaCode: null, center: [23.5, 121] },
			taipei: { name: { en: 'Taipei', zh: '台北市' }, areaCode: '00' },
			newtaipei: { name: { en: 'New Taipei', zh: '新北市' }, areaCode: '05' },
			taoyuan: { name: { en: 'Taoyuan', zh: '桃園市' }, areaCode: '07' },
			hsinchu: { name: { en: 'Hsinchu City', zh: '新竹市' }, areaCode: '09' },
			hsinchuCounty: { name: { en: 'Hsinchu County', zh: '新竹縣' }, areaCode: '0B' },
			miaoli: { name: { en: 'Miaoli', zh: '苗栗縣' }, areaCode: '0A' },
			taichung: { name: { en: 'Taichung', zh: '台中市' }, areaCode: '01' },
			chiayi: { name: { en: 'Chiayi City', zh: '嘉義市' }, areaCode: '08' },
			chiayiCounty: { name: { en: 'Chiayi County', zh: '嘉義縣' }, areaCode: '11' },
			tainan: { name: { en: 'Tainan', zh: '台南市' }, areaCode: '13' },
			kaohsiung: { name: { en: 'Kaohsiung', zh: '高雄市' }, areaCode: '12' },
			pingtung: { name: { en: 'Pingtung', zh: '屏東縣' }, areaCode: '14' },
			taitung: { name: { en: 'Taitung', zh: '台東縣' }, areaCode: '15' }
		};

		// State
		let allStationsCache = [];
		let stations = [];
		let currentCity = 'taipei';
		let currentLang = null;
		let sortState = { column: null, direction: null }; // null, 'asc', 'desc'
		let originalOrder = []; // Store original order for reset

		const LABELS = {
			en: {
				title: 'YouBike Station List',
				loading: 'Loading stations...',
				error: 'Error loading stations',
				showing: 'Showing',
				stations: 'stations',
				headers: ['#', 'Station', 'Location', 'Lat', 'Lng', 'Bikes', 'Slots', 'Dist(m)'],
				switchLang: '中文'
			},
			zh: {
				title: '微笑單車站點列表',
				loading: '載入中...',
				error: '載入失敗',
				showing: '顯示',
				stations: '個站點',
				headers: ['#', '站名', '位置', '緯度', '經度', '可借數', '可停數', '距離(m)'],
				switchLang: 'EN'
			}
		};

		function detectLanguage() {
			const saved = localStorage.getItem('ubike-lang');
			if (saved) return saved;
			const userLang = navigator.language || navigator.userLanguage;
			return (userLang === 'zh-TW' || userLang === 'zh-CN') ? 'zh' : 'en';
		}

		function setLanguage(lang) {
			currentLang = lang;
			localStorage.setItem('ubike-lang', lang);
			document.title = LABELS[lang].title;
			document.getElementById('page-title').textContent = LABELS[lang].title;
			document.getElementById('lang-btn').textContent = LABELS[lang].switchLang;
			// Update navigation buttons
			document.querySelectorAll('.nav-btn').forEach(btn => {
				const text = lang === 'zh' ? btn.dataset.zh : btn.dataset.en;
				if (text) btn.textContent = text;
			});
			updateCitySelector();
			console.log(`[UBike] Language set to: ${lang}`);
		}

		function toggleLang() {
			const newLang = currentLang === 'en' ? 'zh' : 'en';
			setLanguage(newLang);
			if (stations.length > 0) {
				renderTable(stations);
			}
		}

		const deg2rad = (deg) => deg * (Math.PI / 180);

		function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
			const R = 6371000;
			const dLat = deg2rad(lat2 - lat1);
			const dLon = deg2rad(lon2 - lon1);
			const a = Math.sin(dLat / 2) ** 2 +
				Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
				Math.sin(dLon / 2) ** 2;
			const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
			return R * c;
		}

		// Normalize station data from official YouBike API
		function normalizeStation(s) {
			const cityKey = Object.keys(CITIES).find(key => CITIES[key].areaCode === s.area_code) || s.area_code;
			return {
				sno: s.station_no,
				sna: s.name_tw,
				snaen: s.name_en || s.name_tw,
				sarea: s.district_tw,
				sareaen: s.district_en || s.district_tw,
				ar: s.address_tw,
				aren: s.address_en || s.address_tw,
				latitude: parseFloat(s.lat),
				longitude: parseFloat(s.lng),
				available_rent_bikes: parseInt(s.available_spaces) || 0,
				available_return_bikes: parseInt(s.empty_spaces) || 0,
				city: cityKey,
				areaCode: s.area_code
			};
		}

		async function fetchAllStationsFromAPI() {
			console.log('[UBike] Fetching all stations from official API...');
			const response = await fetch(YOUBIKE_API);
			if (!response.ok) {
				throw new Error(`HTTP ${response.status}: ${response.statusText}`);
			}
			const data = await response.json();
			const normalized = data
				.filter(s => s.status === 1)
				.map(normalizeStation);
			console.log(`[UBike] Loaded ${normalized.length} stations from official API`);
			return normalized;
		}

		async function fetchStations() {
			// Fetch all if not cached
			if (allStationsCache.length === 0) {
				allStationsCache = await fetchAllStationsFromAPI();
			}

			// Filter by city
			if (currentCity === 'all') {
				console.log(`[UBike] Returning all ${allStationsCache.length} stations`);
				return allStationsCache;
			}

			const city = CITIES[currentCity];
			if (!city) throw new Error(`Unknown city: ${currentCity}`);

			const filtered = allStationsCache.filter(s => s.areaCode === city.areaCode);
			console.log(`[UBike] Filtered ${filtered.length} stations for ${currentCity}`);
			return filtered;
		}

		function updateCitySelector() {
			const select = document.getElementById('city-select');
			if (!select) return;

			Array.from(select.options).forEach(option => {
				const city = CITIES[option.value];
				if (city) {
					option.textContent = currentLang === 'zh' ? city.name.zh : city.name.en;
				}
			});
		}

		async function changeCity() {
			const select = document.getElementById('city-select');
			currentCity = select.value;
			localStorage.setItem('ubike-city', currentCity);
			console.log(`[UBike] City changed to: ${currentCity}`);

			// Reset sort state
			sortState = { column: null, direction: null };

			// Reload stations
			const container = document.getElementById('table-container');
			const L = LABELS[currentLang];
			container.innerHTML = `<p>${L.loading}</p>`;

			try {
				stations = await fetchStations();
				originalOrder = [...stations];
				renderTable(stations);
			} catch (error) {
				console.error('[UBike] Failed to load stations:', error.message);
				container.innerHTML = `<p style="color: red;">${L.error}: ${error.message}</p>`;
			}
		}

		function getStationName(station) {
			return currentLang === 'zh' ? station.sna : station.snaen;
		}

		function getStationLocation(station) {
			return currentLang === 'zh'
				? `${station.sarea} ${station.ar}`
				: `${station.sareaen} ${station.aren}`;
		}

		function buildTableRow(station, index) {
			const distanceCell = station.distance !== undefined
				? `<td>${station.distance.toFixed(0)}</td>`
				: '';

			// Color code bikes availability
			const bikes = station.available_rent_bikes;
			let bikesClass = '';
			if (bikes === 0) bikesClass = 'bikes-empty';
			else if (bikes <= 3) bikesClass = 'bikes-low';
			else bikesClass = 'bikes-high';

			// Color code slots availability
			const slots = station.available_return_bikes;
			let slotsClass = '';
			if (slots === 0) slotsClass = 'bikes-empty';
			else if (slots <= 3) slotsClass = 'bikes-low';
			else slotsClass = 'bikes-high';

			return `<tr>
				<td>${index + 1}</td>
				<td>${getStationName(station)}</td>
				<td>${getStationLocation(station)}</td>
				<td>${station.latitude.toFixed(4)}</td>
				<td>${station.longitude.toFixed(4)}</td>
				<td class="${bikesClass}">${bikes}</td>
				<td class="${slotsClass}">${slots}</td>
				${distanceCell}
			</tr>`;
		}

		function getSortIcon(colIndex) {
			if (sortState.column !== colIndex) return '⇅';
			return sortState.direction === 'asc' ? '▲' : '▼';
		}

		function sortByColumn(colIndex) {
			// Toggle sort state: null -> desc -> asc -> null
			if (sortState.column !== colIndex) {
				sortState = { column: colIndex, direction: 'desc' };
			} else if (sortState.direction === 'desc') {
				sortState.direction = 'asc';
			} else if (sortState.direction === 'asc') {
				sortState = { column: null, direction: null };
			}

			let sortedStations;
			if (sortState.column === null) {
				// Reset to original order
				sortedStations = [...originalOrder];
				console.log('[UBike] Sort reset to original order');
			} else {
				sortedStations = [...stations].sort((a, b) => {
					let valA, valB;
					switch (colIndex) {
						case 1: // Station name
							valA = getStationName(a) || '';
							valB = getStationName(b) || '';
							return sortState.direction === 'asc'
								? valA.localeCompare(valB)
								: valB.localeCompare(valA);
						case 2: // Location
							valA = getStationLocation(a) || '';
							valB = getStationLocation(b) || '';
							return sortState.direction === 'asc'
								? valA.localeCompare(valB)
								: valB.localeCompare(valA);
						case 3: // Lat
							valA = parseFloat(a.latitude) || 0;
							valB = parseFloat(b.latitude) || 0;
							break;
						case 4: // Lng
							valA = parseFloat(a.longitude) || 0;
							valB = parseFloat(b.longitude) || 0;
							break;
						case 5: // Bikes
							valA = parseInt(a.available_rent_bikes) || 0;
							valB = parseInt(b.available_rent_bikes) || 0;
							break;
						case 6: // Slots
							valA = parseInt(a.available_return_bikes) || 0;
							valB = parseInt(b.available_return_bikes) || 0;
							break;
						case 7: // Distance
							valA = a.distance || 0;
							valB = b.distance || 0;
							break;
						default:
							return 0;
					}
					return sortState.direction === 'asc' ? valA - valB : valB - valA;
				});
				console.log(`[UBike] Sorted by column ${colIndex} (${sortState.direction})`);
			}

			stations = sortedStations;
			renderTable(stations);
		}

		function renderTable(stationList) {
			const L = LABELS[currentLang];
			console.log(`[UBike] Rendering table (${currentLang})`);

			// Include distance header if distance data exists
			const hasDistance = stationList.length > 0 && stationList[0].distance !== undefined;
			const headers = hasDistance ? L.headers : L.headers.slice(0, 7);

			let html = `<table id="tbl">
				<thead>
					<tr>${headers.map((h, i) => {
						if (i === 0) return `<th>${h}</th>`;
						const icon = getSortIcon(i);
						return `<th class="sortable-header" onclick="sortByColumn(${i})">${h}<span class="sort-icon">${icon}</span></th>`;
					}).join('')}</tr>
				</thead>
				<tbody>`;

			for (let i = 0; i < stationList.length; i++) {
				html += buildTableRow(stationList[i], i);
			}

			html += '</tbody></table>';

			document.getElementById('table-container').innerHTML = html;
			document.getElementById('status').textContent = `${L.showing} ${stationList.length} ${L.stations}`;

			// Try to add distance column (only if not already added)
			if (!hasDistance) {
				tryAddDistanceColumn();
			}
		}

		function tryAddDistanceColumn() {
			if (!('geolocation' in navigator)) return;

			navigator.geolocation.getCurrentPosition(
				(pos) => addDistanceColumn(pos.coords.latitude, pos.coords.longitude),
				(error) => console.warn('[UBike] Could not get location:', error.message),
				{ timeout: 10000 }
			);
		}

		let userLocation = null; // Store user location for distance sorting

		function addDistanceColumn(userLat, userLng) {
			const table = document.getElementById('tbl');
			if (!table) return;

			console.log(`[UBike] Adding distance column (user: ${userLat.toFixed(5)}, ${userLng.toFixed(5)})`);

			// Store user location for distance sorting
			userLocation = { lat: userLat, lng: userLng };

			const L = LABELS[currentLang];
			const headerRow = table.querySelector('thead tr');

			// Check if distance column already exists
			if (headerRow.cells.length > 7) return;

			// Add distance to station data
			stations.forEach(station => {
				station.distance = getDistanceFromLatLonInM(
					userLat, userLng,
					parseFloat(station.latitude),
					parseFloat(station.longitude)
				);
			});
			originalOrder.forEach(station => {
				station.distance = getDistanceFromLatLonInM(
					userLat, userLng,
					parseFloat(station.latitude),
					parseFloat(station.longitude)
				);
			});

			const distanceHeader = document.createElement('th');
			distanceHeader.className = 'sortable-header';
			distanceHeader.onclick = () => sortByColumn(7);
			distanceHeader.innerHTML = `${L.headers[7]} <span class="sort-icon">${getSortIcon(7)}</span>`;
			headerRow.appendChild(distanceHeader);

			const rows = table.querySelectorAll('tbody tr');
			rows.forEach((row, i) => {
				const distanceCell = document.createElement('td');
				distanceCell.textContent = stations[i].distance.toFixed(2);
				row.appendChild(distanceCell);
			});

			// Auto-sort by distance (descending first, then asc)
			sortByColumn(7); // desc
			sortByColumn(7); // asc (closest first)
			console.log('[UBike] Sorted by distance (ascending)');
		}

		async function init() {
			// Initialize language
			setLanguage(detectLanguage());

			// Restore saved city preference
			const savedCity = localStorage.getItem('ubike-city');
			if (savedCity && CITIES[savedCity]) {
				currentCity = savedCity;
				document.getElementById('city-select').value = currentCity;
			}

			const container = document.getElementById('table-container');
			const L = LABELS[currentLang];

			try {
				container.innerHTML = `<p>${L.loading}</p>`;
				stations = await fetchStations();
				originalOrder = [...stations]; // Store original order for reset
				renderTable(stations);
				console.log('[UBike] Table rendered successfully');
			} catch (error) {
				console.error('[UBike] Failed to load stations:', error.message);
				container.innerHTML = `<p style="color: red;">${L.error}: ${error.message}</p>`;
			}
		}

		document.addEventListener('DOMContentLoaded', init);
	</script>

<body>
	<div class="header">
		<h1 id="page-title">YouBike Station List</h1>
		<div class="header-controls">
			<a href="index.html" class="nav-btn home" data-en="Home" data-zh="首頁">Home</a>
			<a href="ubike.html" class="nav-btn" data-en="UBike" data-zh="UBike">UBike</a>
			<a href="map.html" class="nav-btn" data-en="Map" data-zh="地圖">Map</a>
			<a href="list.html" class="nav-btn active" data-en="List" data-zh="列表">List</a>
			<a href="mrt.html" class="nav-btn" data-en="MRT" data-zh="捷運">MRT</a>
			<a href="rail.html" class="nav-btn" data-en="Rail" data-zh="台鐵">Rail</a>
			<a href="thsr.html" class="nav-btn" data-en="THSR" data-zh="高鐵">THSR</a>
			<a href="bus.html" class="nav-btn" data-en="Bus" data-zh="公車">Bus</a>
			<select id="city-select" onchange="changeCity()">
				<option value="all">All Cities</option>
