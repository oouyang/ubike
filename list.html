<!DOCTYPE html>
<html>

<head>
	<meta charset='UTF-8'>
	<title>ubike site list</title>
	<script src="sorttable.js"></script>
	<link rel="stylesheet" href="css/sortable-theme-finder.css">
	<script>
		'use strict';

		const API_URL = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';

		function isChineseLocale() {
			const userLang = navigator.language || navigator.userLanguage;
			return userLang === 'zh-TW' || userLang === 'zh-CN';
		}

		const deg2rad = (deg) => deg * (Math.PI / 180);

		function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
			const R = 6371000; // Earth radius in meters
			const dLat = deg2rad(lat2 - lat1);
			const dLon = deg2rad(lon2 - lon1);
			const a = Math.sin(dLat / 2) ** 2 +
				Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
				Math.sin(dLon / 2) ** 2;
			const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
			return R * c;
		}

		async function fetchStations() {
			console.log('[UBike] Fetching station data...');
			const response = await fetch(API_URL);
			if (!response.ok) {
				throw new Error(`HTTP ${response.status}: ${response.statusText}`);
			}
			const data = await response.json();
			console.log(`[UBike] Loaded ${data.length} stations`);
			return data;
		}

		function buildTableRow(station, index, isZh) {
			const name = isZh ? station.sna : station.snaen;
			const location = isZh
				? `${station.sarea} ${station.ar}`
				: `${station.sareaen} ${station.aren}`;

			return `<tr>
				<td>${index + 1}</td>
				<td>${name}</td>
				<td>${location}</td>
				<td>${station.latitude}</td>
				<td>${station.longitude}</td>
				<td>${station.available_rent_bikes}</td>
				<td>${station.available_return_bikes}</td>
			</tr>`;
		}

		function renderTable(stations, isZh) {
			console.log(`[UBike] Rendering table (locale: ${isZh ? 'zh' : 'en'})`);

			const headers = isZh
				? ['#', '站名', '位置', '緯度', '經度', '可借數', '可停數']
				: ['#', 'Station', 'Location', 'Lat', 'Lng', 'Bike #', 'Park #'];

			let html = `<table class="sortable sortable-theme-finder" id="tbl" border="1">
				<thead>
					<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
				</thead>
				<tbody>`;

			for (let i = 0; i < stations.length; i++) {
				html += buildTableRow(stations[i], i, isZh);
			}

			html += '</tbody></table>';
			return html;
		}

		function addDistanceColumn(table, userLat, userLng, isZh) {
			console.log(`[UBike] Calculating distances (user: ${userLat.toFixed(5)}, ${userLng.toFixed(5)})`);

			const headerRow = table.querySelector('thead tr');
			const distanceHeader = document.createElement('th');
			distanceHeader.textContent = isZh ? '距離(m)' : 'Dist(m)';
			headerRow.appendChild(distanceHeader);

			const rows = table.querySelectorAll('tbody tr');
			rows.forEach(row => {
				const cells = row.getElementsByTagName('td');
				const lat = parseFloat(cells[3].textContent);
				const lng = parseFloat(cells[4].textContent);
				const distance = getDistanceFromLatLonInM(userLat, userLng, lat, lng);

				const distanceCell = document.createElement('td');
				distanceCell.textContent = distance.toFixed(2);
				distanceCell.setAttribute('data-value', distance);
				row.appendChild(distanceCell);
			});

			// Re-initialize sortable and sort by distance
			if (typeof sorttable !== 'undefined') {
				sorttable.makeSortable(table);
				distanceHeader.click(); // Sort by distance ascending
				console.log('[UBike] Sorted by distance');
			}
		}

		async function init() {
			const container = document.getElementById('ubike');
			const isZh = isChineseLocale();

			try {
				container.innerHTML = isZh ? '<p>載入中...</p>' : '<p>Loading stations...</p>';
				const stations = await fetchStations();
				container.innerHTML = renderTable(stations, isZh);

				const table = document.getElementById('tbl');

				// Add distance column if geolocation available
				if ('geolocation' in navigator) {
					navigator.geolocation.getCurrentPosition(
						(pos) => {
							addDistanceColumn(table, pos.coords.latitude, pos.coords.longitude, isZh);
						},
						(error) => {
							console.warn('[UBike] Could not get location:', error.message);
						},
						{ timeout: 10000 }
					);
				}

				console.log('[UBike] Table rendered successfully');
			} catch (error) {
				console.error('[UBike] Failed to load stations:', error.message);
				const msg = isZh ? '載入失敗' : 'Error loading stations';
				container.innerHTML = `<p style="color: red;">${msg}: ${error.message}</p>`;
			}
		}

		document.addEventListener('DOMContentLoaded', init);
	</script>
	<style>
		body {
			font-family: sans-serif;
		}
	</style>
</head>

<body>
	<div id='ubike'></div>
</body>

</html>
