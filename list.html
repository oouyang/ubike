<!DOCTYPE html>
<html>

<head>
	<meta charset='UTF-8'>
	<title>ubike site list</title>
	<script>
		function httpGet(url) {
			var xmlHttp = new XMLHttpRequest({
				mozSystem: true
			});
			xmlHttp.open("GET", url, false);
			xmlHttp.send(null);
			return xmlHttp.responseText;
		}

		function init() {
			var url = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';
			var userLang = navigator.language || navigator.userLanguage;
			var isZh = false;
			if (userLang == 'zh-TW' || userLang == 'zh-CN') {
				isZh = true;
			}
			var response = httpGet(url);
			var obj = JSON.parse(response);
			var content = '<table border=1><tr><th>#</th><th>Station</th><th>Location</th>' + '<th>Lat</th><th>Lng</th><th>Bike #</th><th>Park #</th></tr>';
			if (isZh) {
				content = '<table border=1><tr><th>#</th><th>站名</th><th>位置</th>' + '<th>經度</th><th>緯度</th><th>可借數</th><th>可停數</th></tr>';
			}
			for (var i in obj) {
				var sna, ar;
				if (isZh) {
					sna = obj[i].sna;
					ar = obj[i].sarea + ' ' + obj[i].ar;
				} else {
					sna = obj[i].snaen;
					ar = obj[i].sareaen + ' ' + obj[i].aren;
				}
				content = content + "<tr><td>" + (parseInt(i) + 1) + "</td><td>"
					+ sna + "</td><td>" + ar + "</td><td>"
					+ obj[i].latitude + "</td><td>" + obj[i].longitude + "</td><td>"
					+ obj[i].available_rent_bikes + "</td><td>" + obj[i].available_return_bikes + "</td></tr>\n";
			}
			content = content + "</table>";
			document.getElementById("ubike").innerHTML = content;
		}
	</script>
	<style>
		tr:nth-child(even) {
			background: #CCC
		}
		tr:nth-child(odd) {
			background: #FFF
		}
	</style>
</head>

<body onload=init()>
	<p id='ubike'></p>
</body>

</html>
