<!DOCTYPE html>
<html>

<head>
	<meta charset='UTF-8'>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>YouBike Station List</title>
	<link rel="stylesheet" href="css/sortable-theme-finder.css">
	<script>
		'use strict';

		const API_URL = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';

		// State
		let stations = [];
		let currentLang = null;
		let sortState = { column: null, direction: null }; // null, 'asc', 'desc'
		let originalOrder = []; // Store original order for reset

		const LABELS = {
			en: {
				title: 'YouBike Station List',
				loading: 'Loading stations...',
				error: 'Error loading stations',
				showing: 'Showing',
				stations: 'stations',
				headers: ['#', 'Station', 'Location', 'Lat', 'Lng', 'Bikes', 'Slots', 'Dist(m)'],
				switchLang: '中文'
			},
			zh: {
				title: '微笑單車站點列表',
				loading: '載入中...',
				error: '載入失敗',
				showing: '顯示',
				stations: '個站點',
				headers: ['#', '站名', '位置', '緯度', '經度', '可借數', '可停數', '距離(m)'],
				switchLang: 'EN'
			}
		};

		function detectLanguage() {
			const saved = localStorage.getItem('ubike-lang');
			if (saved) return saved;
			const userLang = navigator.language || navigator.userLanguage;
			return (userLang === 'zh-TW' || userLang === 'zh-CN') ? 'zh' : 'en';
		}

		function setLanguage(lang) {
			currentLang = lang;
			localStorage.setItem('ubike-lang', lang);
			document.title = LABELS[lang].title;
			document.getElementById('lang-btn').textContent = LABELS[lang].switchLang;
			console.log(`[UBike] Language set to: ${lang}`);
		}

		function toggleLanguage() {
			const newLang = currentLang === 'en' ? 'zh' : 'en';
			setLanguage(newLang);
			if (stations.length > 0) {
				renderTable(stations);
			}
		}

		const deg2rad = (deg) => deg * (Math.PI / 180);

		function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
			const R = 6371000;
			const dLat = deg2rad(lat2 - lat1);
			const dLon = deg2rad(lon2 - lon1);
			const a = Math.sin(dLat / 2) ** 2 +
				Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
				Math.sin(dLon / 2) ** 2;
			const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
			return R * c;
		}

		async function fetchStations() {
			console.log('[UBike] Fetching station data...');
			const response = await fetch(API_URL);
			if (!response.ok) {
				throw new Error(`HTTP ${response.status}: ${response.statusText}`);
			}
			const data = await response.json();
			console.log(`[UBike] Loaded ${data.length} stations`);
			return data;
		}

		function getStationName(station) {
			return currentLang === 'zh' ? station.sna : station.snaen;
		}

		function getStationLocation(station) {
			return currentLang === 'zh'
				? `${station.sarea} ${station.ar}`
				: `${station.sareaen} ${station.aren}`;
		}

		function buildTableRow(station, index) {
			const distanceCell = station.distance !== undefined
				? `<td>${station.distance.toFixed(2)}</td>`
				: '';
			return `<tr>
				<td>${index + 1}</td>
				<td>${getStationName(station)}</td>
				<td>${getStationLocation(station)}</td>
				<td>${station.latitude}</td>
				<td>${station.longitude}</td>
				<td>${station.available_rent_bikes}</td>
				<td>${station.available_return_bikes}</td>
				${distanceCell}
			</tr>`;
		}

		function getSortIcon(colIndex) {
			if (sortState.column !== colIndex) return '⇅';
			return sortState.direction === 'asc' ? '▲' : '▼';
		}

		function sortByColumn(colIndex) {
			// Toggle sort state: null -> desc -> asc -> null
			if (sortState.column !== colIndex) {
				sortState = { column: colIndex, direction: 'desc' };
			} else if (sortState.direction === 'desc') {
				sortState.direction = 'asc';
			} else if (sortState.direction === 'asc') {
				sortState = { column: null, direction: null };
			}

			let sortedStations;
			if (sortState.column === null) {
				// Reset to original order
				sortedStations = [...originalOrder];
				console.log('[UBike] Sort reset to original order');
			} else {
				sortedStations = [...stations].sort((a, b) => {
					let valA, valB;
					switch (colIndex) {
						case 1: // Station name
							valA = getStationName(a) || '';
							valB = getStationName(b) || '';
							return sortState.direction === 'asc'
								? valA.localeCompare(valB)
								: valB.localeCompare(valA);
						case 2: // Location
							valA = getStationLocation(a) || '';
							valB = getStationLocation(b) || '';
							return sortState.direction === 'asc'
								? valA.localeCompare(valB)
								: valB.localeCompare(valA);
						case 3: // Lat
							valA = parseFloat(a.latitude) || 0;
							valB = parseFloat(b.latitude) || 0;
							break;
						case 4: // Lng
							valA = parseFloat(a.longitude) || 0;
							valB = parseFloat(b.longitude) || 0;
							break;
						case 5: // Bikes
							valA = parseInt(a.available_rent_bikes) || 0;
							valB = parseInt(b.available_rent_bikes) || 0;
							break;
						case 6: // Slots
							valA = parseInt(a.available_return_bikes) || 0;
							valB = parseInt(b.available_return_bikes) || 0;
							break;
						case 7: // Distance
							valA = a.distance || 0;
							valB = b.distance || 0;
							break;
						default:
							return 0;
					}
					return sortState.direction === 'asc' ? valA - valB : valB - valA;
				});
				console.log(`[UBike] Sorted by column ${colIndex} (${sortState.direction})`);
			}

			stations = sortedStations;
			renderTable(stations);
		}

		function renderTable(stationList) {
			const L = LABELS[currentLang];
			console.log(`[UBike] Rendering table (${currentLang})`);

			// Include distance header if distance data exists
			const hasDistance = stationList.length > 0 && stationList[0].distance !== undefined;
			const headers = hasDistance ? L.headers : L.headers.slice(0, 7);

			let html = `<table class="sortable-theme-finder" id="tbl" border="1">
				<thead>
					<tr>${headers.map((h, i) => {
						if (i === 0) return `<th>${h}</th>`;
						const icon = getSortIcon(i);
						return `<th class="sortable-header" onclick="sortByColumn(${i})">${h} <span class="sort-icon">${icon}</span></th>`;
					}).join('')}</tr>
				</thead>
				<tbody>`;

			for (let i = 0; i < stationList.length; i++) {
				html += buildTableRow(stationList[i], i);
			}

			html += '</tbody></table>';

			document.getElementById('table-container').innerHTML = html;
			document.getElementById('status').textContent = `${L.showing} ${stationList.length} ${L.stations}`;

			// Try to add distance column (only if not already added)
			if (!hasDistance) {
				tryAddDistanceColumn();
			}
		}

		function tryAddDistanceColumn() {
			if (!('geolocation' in navigator)) return;

			navigator.geolocation.getCurrentPosition(
				(pos) => addDistanceColumn(pos.coords.latitude, pos.coords.longitude),
				(error) => console.warn('[UBike] Could not get location:', error.message),
				{ timeout: 10000 }
			);
		}

		let userLocation = null; // Store user location for distance sorting

		function addDistanceColumn(userLat, userLng) {
			const table = document.getElementById('tbl');
			if (!table) return;

			console.log(`[UBike] Adding distance column (user: ${userLat.toFixed(5)}, ${userLng.toFixed(5)})`);

			// Store user location for distance sorting
			userLocation = { lat: userLat, lng: userLng };

			const L = LABELS[currentLang];
			const headerRow = table.querySelector('thead tr');

			// Check if distance column already exists
			if (headerRow.cells.length > 7) return;

			// Add distance to station data
			stations.forEach(station => {
				station.distance = getDistanceFromLatLonInM(
					userLat, userLng,
					parseFloat(station.latitude),
					parseFloat(station.longitude)
				);
			});
			originalOrder.forEach(station => {
				station.distance = getDistanceFromLatLonInM(
					userLat, userLng,
					parseFloat(station.latitude),
					parseFloat(station.longitude)
				);
			});

			const distanceHeader = document.createElement('th');
			distanceHeader.className = 'sortable-header';
			distanceHeader.onclick = () => sortByColumn(7);
			distanceHeader.innerHTML = `${L.headers[7]} <span class="sort-icon">${getSortIcon(7)}</span>`;
			headerRow.appendChild(distanceHeader);

			const rows = table.querySelectorAll('tbody tr');
			rows.forEach((row, i) => {
				const distanceCell = document.createElement('td');
				distanceCell.textContent = stations[i].distance.toFixed(2);
				row.appendChild(distanceCell);
			});

			// Auto-sort by distance (descending first, then asc)
			sortByColumn(7); // desc
			sortByColumn(7); // asc (closest first)
			console.log('[UBike] Sorted by distance (ascending)');
		}

		async function init() {
			// Initialize language
			setLanguage(detectLanguage());

			const container = document.getElementById('table-container');
			const L = LABELS[currentLang];

			try {
				container.innerHTML = `<p>${L.loading}</p>`;
				stations = await fetchStations();
				originalOrder = [...stations]; // Store original order for reset
				renderTable(stations);
				console.log('[UBike] Table rendered successfully');
			} catch (error) {
				console.error('[UBike] Failed to load stations:', error.message);
				container.innerHTML = `<p style="color: red;">${L.error}: ${error.message}</p>`;
			}
		}

		document.addEventListener('DOMContentLoaded', init);
	</script>
	<style>
		body {
			font-family: sans-serif;
			margin: 0;
			padding: 10px;
		}
		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 10px;
		}
		.header h1 {
			margin: 0;
			font-size: 1.5em;
		}
		#lang-btn {
			padding: 8px 16px;
			font-size: 14px;
			cursor: pointer;
			background: #4CAF50;
			color: white;
			border: none;
			border-radius: 4px;
		}
		#lang-btn:hover {
			background: #45a049;
		}
		#status {
			color: #666;
			font-size: 0.9em;
			margin-bottom: 10px;
		}
		.sortable-header {
			cursor: pointer;
			user-select: none;
		}
		.sortable-header:hover {
			background: #e8f5e9;
		}
		.sort-icon {
			font-size: 0.8em;
			margin-left: 4px;
			color: #888;
		}
		.sortable-header:hover .sort-icon {
			color: #4CAF50;
		}
	</style>
</head>

<body>
	<div class="header">
		<h1>YouBike Station List</h1>
		<button id="lang-btn" onclick="toggleLanguage()">中文</button>
	</div>
	<div id="status"></div>
	<div id="table-container"></div>
</body>

</html>
